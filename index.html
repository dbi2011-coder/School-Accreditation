        function chunkArray(arr, size) { const chunks = []; for (let i = 0; i < arr.length; i += size) chunks.push(arr.slice(i, i + size)); return chunks; }
        function getDateSortKey(dateStr) {
            if (!dateStr) return 999;
            if (dateStr === 'الفصل الدراسي الأول') return 1;
            if (dateStr === 'الفصل الدراسي الثاني') return 2;
            if (dateStr === 'العام الدراسي كاملاً') return 3;
            return 0;
        }
        function collectAllEvidenceImages(evidence) {
            const allImages = [];
            if (evidence.images && evidence.images.length > 0) evidence.images.forEach(img => allImages.push(img));
            if (evidence.appendices && evidence.appendices.length > 0) {
                evidence.appendices.forEach(app => { if (app.images && app.images.length > 0) app.images.forEach(img => allImages.push(img)); });
            }
            return allImages;
        }
        function collectAppendixImagesOnly(evidence) {
            const allImages = [];
            if (evidence.appendices && evidence.appendices.length > 0) {
                evidence.appendices.forEach(app => { if (app.images && app.images.length > 0) app.images.forEach(img => allImages.push(img)); });
            }
            return allImages;
        }
        function buildUnifiedImagesForSingleEvidence(evidence) {
            const allImages = collectAllEvidenceImages(evidence);
            if (allImages.length === 0) return { firstPageImages: [], extraPagesHtml: '', totalImages: 0 };
            if (allImages.length >= 3) {
                const chunks = chunkArray(allImages, 6);
                let extraPagesHtml = '';
                chunks.forEach((chunk, idx) => {
                    const gridClass = `images-grid-${chunk.length}`;
                    const isLastChunk = idx === chunks.length - 1;
                    extraPagesHtml += `<div class="evidence-print-page"><div class="${gridClass}">${chunk.map(img => `<div class="media-image"><img src="${img}" alt="صورة"></div>`).join('')}</div>${isLastChunk ? `<div class="signature">مدير المدرسة: أ / عمر عبد الله الحماد</div>` : ''}</div>`;
                });
                return { firstPageImages: [], extraPagesHtml, totalImages: allImages.length };
            }
            return { firstPageImages: allImages, extraPagesHtml: '', totalImages: allImages.length };
        }
        function buildUnifiedImagesForReport(evidence) {
            const allImages = collectAllEvidenceImages(evidence);
            if (allImages.length === 0) return { firstPageImages: [], extraPagesHtml: '' };
            const firstPageImages = allImages.slice(0, 4);
            const remainingImages = allImages.slice(4);
            const remainingChunks = chunkArray(remainingImages, 6);
            let extraPagesHtml = '';
            remainingChunks.forEach(chunk => {
                const gridClass = `images-grid-${chunk.length}`;
                extraPagesHtml += `<div class="report-page"><div class="${gridClass}">${chunk.map(img => `<div class="media-image"><img src="${img}" alt="صورة"></div>`).join('')}</div></div>`;
            });
            return { firstPageImages, extraPagesHtml };
        }
        function buildReadyMadeAppendixImagesPages(evidence, pageClass = 'report-page') {
            const allImages = collectAppendixImagesOnly(evidence);
            if (allImages.length === 0) return '';
            const chunks = chunkArray(allImages, 6);
            let html = '';
            chunks.forEach(chunk => {
                const gridClass = `images-grid-${chunk.length}`;
                html += `<div class="${pageClass}"><div class="${gridClass}">${chunk.map(img => `<div class="media-image"><img src="${img}" alt="صورة"></div>`).join('')}</div></div>`;
            });
            return html;
        }
        function buildReadyMadeAppendixImagesSingleGrid(evidence) {
            const allImages = collectAppendixImagesOnly(evidence);
            if (allImages.length === 0) return '';
            let gridClass;
            if (allImages.length === 1) gridClass = 'images-grid-1';
            else if (allImages.length === 2) gridClass = 'images-grid-2';
            else if (allImages.length === 3) gridClass = 'images-grid-3';
            else if (allImages.length === 4) gridClass = 'images-grid-4';
            else gridClass = 'images-grid-6';
            return `<div style="margin-top: 20px;"><div class="${gridClass}">${allImages.map(img => `<div class="media-image"><img src="${img}" alt="صورة"></div>`).join('')}</div></div>`;
        }
        function buildAllImagesGridForView(evidence) {
            const allImages = collectAllEvidenceImages(evidence);
            if (allImages.length === 0) return '';
            let gridClass;
            if (allImages.length === 1) gridClass = 'images-grid-1';
            else if (allImages.length === 2) gridClass = 'images-grid-2';
            else if (allImages.length === 3) gridClass = 'images-grid-3';
            else if (allImages.length === 4) gridClass = 'images-grid-4';
            else gridClass = 'images-grid-6';
            return `<div style="margin-top: 20px;"><div class="${gridClass}">${allImages.map(img => `<div class="media-image"><img src="${img}" alt="صورة"></div>`).join('')}</div></div>`;
        }
        function buildFirstPageImagesGrid(images) {
            if (!images || images.length === 0) return '';

            return `<div class="${gridClass}">${images.map(img => `<div class="media-image"><img src="${img}" alt="صورة"></div>`).join('')}</div>`;
        }
        function createProgressBar(containerId, totalCount, label = 'جاري تحميل المرفقات') {

        }
        function updateProgressBar(containerId, current, total) {
            const bar = document.getElementById(`${containerId}_bar`);
            const text = document.querySelector(`#${containerId} .pdf-progress-text`);

        function buildDateOptionsHtml(prefix, currentValue = '') {

        }
        function handleDateTypeChange(prefix) {
            const selected = document.querySelector(`input[name="${prefix}_dateType"]:checked`).value;
            const dateInput = document.getElementById(`${prefix}_dateInput`);
            if (!dateInput) return;
            if (selected === 'specific') { dateInput.disabled = false; dateInput.value = ''; }
            else { dateInput.disabled = true; dateInput.value = ''; }
        }
        function getDateValue(prefix) {
            const selected = document.querySelector(`input[name="${prefix}_dateType"]:checked`);
            if (!selected) return '';
            switch (selected.value) {
                case 'specific': return document.getElementById(`${prefix}_dateInput`).value;
                case 'term1': return 'الفصل الدراسي الأول';
                case 'term2': return 'الفصل الدراسي الثاني';
                case 'year': return 'العام الدراسي كاملاً';
                default: return '';
            }
        }
        function setDateValue(prefix, value) {
            let radioValue = 'specific';
            if (value === 'الفصل الدراسي الأول') radioValue = 'term1';
            else if (value === 'الفصل الدراسي الثاني') radioValue = 'term2';
            else if (value === 'العام الدراسي كاملاً') radioValue = 'year';
            const radio = document.querySelector(`input[name="${prefix}_dateType"][value="${radioValue}"]`);
            if (radio) radio.checked = true;
            const dateInput = document.getElementById(`${prefix}_dateInput`);
            if (dateInput) {
                if (radioValue === 'specific') { dateInput.disabled = false; dateInput.value = value; }
                else { dateInput.disabled = true; dateInput.value = ''; }
            }
        }

        function showCustomModal({ type = 'info', title = '', message = '', icon = 'fa-info-circle', confirmText = 'موافق', cancelText = 'إلغاء', showCancel = false, onConfirm = null, onCancel = null, input = null, textarea = null }) {
            const iconMap = { 'success': 'fa-check-circle', 'danger': 'fa-exclamation-triangle', 'warning': 'fa-exclamation-circle', 'info': 'fa-info-circle', 'primary': 'fa-bell' };
            const finalIcon = icon || iconMap[type] || 'fa-info-circle';
            const headerClass = type || 'info';
            let bodyContent = '';
            if (message) bodyContent += `<div class="modal-message">${message}</div>`;
            if (input) bodyContent += `<input type="text" id="modalInputField" class="modal-input" placeholder="${input.placeholder || ''}" value="${input.value || ''}">`;
            if (textarea) bodyContent += `<textarea id="modalTextareaField" class="modal-textarea" placeholder="${textarea.placeholder || ''}">${textarea.value || ''}</textarea>`;
            const modalHtml = `<div class="modal-overlay" id="customModal"><div class="modal-content"><div class="modal-header ${headerClass}"><div class="modal-icon"><i class="fas ${finalIcon}"></i></div><div class="modal-title">${title}</div><button class="modal-close-btn" onclick="closeCustomModal()"><i class="fas fa-times"></i></button></div><div class="modal-body">${bodyContent}</div><div class="modal-footer"><button class="modal-btn modal-btn-primary" onclick="confirmCustomModal()"><i class="fas ${type === 'danger' ? 'fa-trash' : 'fa-check'}"></i> ${confirmText}</button>${showCancel ? `<button class="modal-btn modal-btn-secondary" onclick="cancelCustomModal()"><i class="fas fa-times"></i> ${cancelText}</button>` : ''}</div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            window._modalCallbacks = { onConfirm, onCancel };
            document.getElementById('customModal').addEventListener('click', function(e) { if (e.target === this) { closeCustomModal(); if (window._modalCallbacks.onCancel) window._modalCallbacks.onCancel(); } });
            document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeCustomModal(); if (window._modalCallbacks.onCancel) window._modalCallbacks.onCancel(); } });
            if (input) setTimeout(() => { const f = document.getElementById('modalInputField'); if (f) f.focus(); }, 100);
            if (textarea) setTimeout(() => { const f = document.getElementById('modalTextareaField'); if (f) f.focus(); }, 100);
        }
        function closeCustomModal() { const m = document.getElementById('customModal'); if (m) m.remove(); }
        function confirmCustomModal() {
            const callbacks = window._modalCallbacks || {};
            let inputValue = null, textareaValue = null;
            const inputField = document.getElementById('modalInputField'); if (inputField) inputValue = inputField.value;
            const textareaField = document.getElementById('modalTextareaField'); if (textareaField) textareaValue = textareaField.value;
            closeCustomModal();
            if (callbacks.onConfirm) callbacks.onConfirm(inputValue, textareaValue);
        }
        function cancelCustomModal() { const callbacks = window._modalCallbacks || {}; closeCustomModal(); if (callbacks.onCancel) callbacks.onCancel(); }
        function showSuccessModal(title, message, onConfirm = null) { showCustomModal({ type: 'success', title, message, icon: 'fa-check-circle', confirmText: 'موافق', showCancel: false, onConfirm }); }
        function showErrorModal(title, message, onConfirm = null) { showCustomModal({ type: 'danger', title, message, icon: 'fa-exclamation-triangle', confirmText: 'موافق', showCancel: false, onConfirm }); }
        function showConfirmModal(title, message, onConfirm, onCancel = null) { showCustomModal({ type: 'warning', title, message, icon: 'fa-exclamation-circle', confirmText: 'تأكيد', cancelText: 'إلغاء', showCancel: true, onConfirm, onCancel }); }
        function showInputModal(title, message, placeholder, value, onConfirm, onCancel = null) { showCustomModal({ type: 'primary', title, message, icon: 'fa-edit', confirmText: 'حفظ', cancelText: 'إلغاء', showCancel: true, input: { placeholder, value }, onConfirm, onCancel }); }
        function showTextareaModal(title, message, placeholder, value, onConfirm, onCancel = null) { showCustomModal({ type: 'danger', title, message, icon: 'fa-comment-alt', confirmText: 'تأكيد الرفض', cancelText: 'إلغاء', showCancel: true, textarea: { placeholder, value }, onConfirm, onCancel }); }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            try {
                const result = await apiCall('/api/login', { method: 'POST', body: { username, password } });
                if (result.success) {
                    currentUser = result.user;
                    await loadUsersFromAPI();
                    await loadEvidencesFromAPI();
                    showMainApp();
                    startAutoRefresh();
                } else {
                    showErrorModal('خطأ في تسجيل الدخول', result.error || 'بيانات الدخول غير صحيحة');
                }
            } catch (error) {
                showErrorModal('خطأ في الاتصال', 'تعذر الاتصال بالخادم. تحقق من الإنترنت.');
            }
        }

                <div class="content-header"><h1>إدارة المستخدمين</h1></div>
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">قائمة المستخدمين</div><button class="btn-etec-primary" onclick="showAddUserModal()"><i class="fas fa-plus"></i> إضافة مستخدم</button></div>
                    <div class="table-responsive">
                        <table class="etec-table">
                            <thead><tr><th>اسم العضو</th><th>اسم المستخدم</th><th>الصلاحية</th><th>الإجراءات</th></tr></thead>
                            <tbody>${users.map(user => `<tr>
                                <td class="evidence-title-cell" data-label="اسم العضو">${user.name}</td>
                                <td data-label="اسم المستخدم">${user.username}</td>
                                <td data-label="الصلاحية">${user.roleLabel}</td>
                                <td class="actions-cell" data-label="الإجراءات">
                                    <button class="btn-etec-secondary btn-sm" onclick="editUser(${user.id})"><i class="fas fa-edit"></i> تعديل</button>
                                    <button class="btn-etec-primary btn-sm" onclick="deleteUser(${user.id})" style="background-color: #E74C3C;"><i class="fas fa-trash"></i> حذف</button>
                                </td>
                            </tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function showAddUserModal() {
            const modalHtml = `<div class="modal-overlay" id="addUserModal"><div class="modal-content" style="max-width: 550px;"><div class="modal-header primary"><div class="modal-icon"><i class="fas fa-user-plus"></i></div><div class="modal-title">إضافة مستخدم جديد</div><button class="modal-close-btn" onclick="closeAddUserModal()"><i class="fas fa-times"></i></button></div><div class="modal-body"><div class="modal-form-group"><label>اسم العضو</label><input type="text" id="addUserName" class="modal-input" placeholder="أدخل اسم العضو" required></div><div class="modal-form-group"><label>اسم المستخدم</label><input type="text" id="addUsername" class="modal-input" placeholder="أدخل اسم المستخدم" required></div><div class="modal-form-group"><label>كلمة المرور</label><input type="password" id="addUserPassword" class="modal-input" placeholder="أدخل كلمة المرور" required></div><div class="modal-form-group"><label>الصلاحية</label><select id="addUserRole" class="modal-select" required><option value="">اختر الصلاحية</option><option value="leader">مدير المدرسة</option><option value="internal_committee">عضو فريق التقويم الداخلي</option><option value="member">عضو</option><option value="external_committee">عضو فريق التقييم الخارجي</option></select></div></div><div class="modal-footer"><button class="modal-btn modal-btn-success" onclick="confirmAddUser()"><i class="fas fa-plus"></i> إضافة</button><button class="modal-btn modal-btn-secondary" onclick="closeAddUserModal()"><i class="fas fa-times"></i> إلغاء</button></div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('addUserModal').addEventListener('click', function(e) { if (e.target === this) closeAddUserModal(); });
            setTimeout(() => { const f = document.getElementById('addUserName'); if (f) f.focus(); }, 100);
        }
        function closeAddUserModal() { const m = document.getElementById('addUserModal'); if (m) m.remove(); }
        async function confirmAddUser() {
            const name = document.getElementById('addUserName').value.trim();
            const username = document.getElementById('addUsername').value.trim();
            const password = document.getElementById('addUserPassword').value.trim();
            const role = document.getElementById('addUserRole').value;
            if (!name || !username || !password || !role) { showErrorModal('خطأ', 'الرجاء إكمال جميع الحقول'); return; }
            const roleLabels = { 'leader': 'مدير المدرسة', 'internal_committee': 'عضو فريق التقويم الداخلي', 'member': 'عضو', 'external_committee': 'عضو فريق التقييم الخارجي' };
            try {
                const result = await apiCall('/api/users', { method: 'POST', body: { name, username, password, role, roleLabel: roleLabels[role] } });
                if (result.success) {
                    closeAddUserModal();
                    await loadUsersFromAPI();
                    showSuccessModal('تمت الإضافة', `تم إضافة المستخدم "${name}" بنجاح`, () => showUserManagement());
                } else {
                    showErrorModal('خطأ', result.error || 'فشل الإضافة');
                }
            } catch (error) { showErrorModal('خطأ', 'تعذر الاتصال بالخادم'); }
        }

        function editUser(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;
            const modalHtml = `
                <div class="modal-overlay" id="editUserModal">
                    <div class="modal-content" style="max-width: 550px;">
                        <div class="modal-header primary">
                            <div class="modal-icon"><i class="fas fa-user-edit"></i></div>
                            <div class="modal-title">تعديل بيانات المستخدم</div>
                            <button class="modal-close-btn" onclick="closeEditUserModal()"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="modal-body">
                            <div class="modal-form-group">
                                <label>اسم العضو</label>
                                <input type="text" id="editUserName" class="modal-input" value="${user.name}" required>
                            </div>
                            <div class="modal-form-group">
                                <label>اسم المستخدم (username)</label>
                                <input type="text" id="editUsername" class="modal-input" value="${user.username}" required>
                            </div>
                            <div class="modal-form-group">
                                <label>كلمة المرور الجديدة (اتركها فارغة للإبقاء على الحالية)</label>
                                <input type="password" id="editUserPassword" class="modal-input" placeholder="••••••••">
                            </div>
                            <div class="modal-form-group">
                                <label>الصلاحية</label>
                                <select id="editUserRole" class="modal-select" required>
                                    <option value="leader" ${user.role === 'leader' ? 'selected' : ''}>مدير المدرسة</option>
                                    <option value="internal_committee" ${user.role === 'internal_committee' ? 'selected' : ''}>عضو فريق التقويم الداخلي</option>
                                    <option value="member" ${user.role === 'member' ? 'selected' : ''}>عضو</option>
                                    <option value="external_committee" ${user.role === 'external_committee' ? 'selected' : ''}>عضو فريق التقييم الخارجي</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="modal-btn modal-btn-success" onclick="saveEditUser(${user.id})"><i class="fas fa-save"></i> حفظ التعديلات</button>
                            <button class="modal-btn modal-btn-secondary" onclick="closeEditUserModal()"><i class="fas fa-times"></i> إلغاء</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('editUserModal').addEventListener('click', function(e) { if (e.target === this) closeEditUserModal(); });
            setTimeout(() => { const f = document.getElementById('editUserName'); if (f) f.focus(); }, 100);
        }
        function closeEditUserModal() { const m = document.getElementById('editUserModal'); if (m) m.remove(); }
        async function saveEditUser(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;
            const name = document.getElementById('editUserName').value.trim();
            const username = document.getElementById('editUsername').value.trim();
            const password = document.getElementById('editUserPassword').value.trim();
            const role = document.getElementById('editUserRole').value;
            if (!name || !username || !role) { showErrorModal('خطأ', 'الرجاء إكمال الحقول المطلوبة'); return; }
            const roleLabels = { 'leader': 'مدير المدرسة', 'internal_committee': 'عضو فريق التقويم الداخلي', 'member': 'عضو', 'external_committee': 'عضو فريق التقييم الخارجي' };
            const body = { name, username, role, roleLabel: roleLabels[role] };
            if (password) body.password = password;
            try {
                const result = await apiCall(`/api/users/${id}`, { method: 'PUT', body });
                if (result.success) {
                    closeEditUserModal();
                    await loadUsersFromAPI();
                    showSuccessModal('تم التعديل', `تم تحديث بيانات المستخدم "${name}" بنجاح`, () => showUserManagement());
                } else {
                    showErrorModal('خطأ', result.error || 'فشل التعديل');
                }
            } catch (error) { showErrorModal('خطأ', 'تعذر تحديث البيانات'); }
        }

        async function deleteUser(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;
            if (user.role === 'leader') {
                const leadersCount = users.filter(u => u.role === 'leader').length;
                if (leadersCount <= 1) { showErrorModal('لا يمكن الحذف', 'لا يمكن حذف آخر مدير مدرسة'); return; }
            }
            showConfirmModal('تأكيد الحذف', `هل أنت متأكد من حذف المستخدم "${user.name}"؟`, async () => {
                try {
                    const result = await apiCall(`/api/users/${id}`, { method: 'DELETE' });
                    if (result.success) {
                        await loadUsersFromAPI();
                        showSuccessModal('تم الحذف', 'تم حذف المستخدم بنجاح', () => showUserManagement());
                    }
                } catch (error) { showErrorModal('خطأ', 'تعذر حذف المستخدم'); }
            });
        }

        function showEvidenceManagement() {
            const contentArea = document.getElementById('contentArea');
            let buttonsHtml = `
                <div class="content-header"><h1>إدارة الشواهد والأدلة</h1></div>
                <div class="buttons-group">
                    <button class="btn-etec-primary" onclick="showAddEvidenceForm()"><i class="fas fa-plus"></i> إضافة شاهد جديد</button>
                    <button class="btn-etec-secondary" onclick="showPreviousEvidences()"><i class="fas fa-list"></i> استعراض الشواهد المسجلة</button>
            `;
            if (currentUser.role === 'leader' || currentUser.role === 'internal_committee') {
                buttonsHtml += `<button class="btn-etec-warning" onclick="showEvidenceApproval()"><i class="fas fa-check-circle"></i> اعتماد الشواهد</button>`;
            }
            buttonsHtml += `</div><div id="evidenceContent"></div>`;
            contentArea.innerHTML = buttonsHtml;
            showPreviousEvidences();
        }

        function getRequiredApprovers(evidence) {
            const approvers = [];
            users.filter(u => u.role === 'internal_committee' && u.id !== evidence.userId).forEach(u => approvers.push({ userId: u.id, userName: u.name, role: u.roleLabel, status: 'waiting' }));
            users.filter(u => u.role === 'leader' && u.id !== evidence.userId).forEach(u => approvers.push({ userId: u.id, userName: u.name, role: u.roleLabel, status: 'waiting' }));
            return approvers;
        }
        function isFullyApproved(evidence) {
            if (!evidence.approvals || evidence.approvals.length === 0) return false;
            const required = getRequiredApprovers(evidence);
            if (required.length === 0) return true;
            return required.every(req => {
                const approval = evidence.approvals.find(a => a.userId === req.userId);
                return approval && approval.status === 'approved';
            });
        }
        function hasRejection(evidence) { return evidence.approvals && evidence.approvals.some(a => a.status === 'rejected'); }
        function getEvidenceFinalStatus(evidence) { if (hasRejection(evidence)) return 'rejected'; if (isFullyApproved(evidence)) return 'approved'; return 'pending'; }
        function canUserApprove(evidence) { if (currentUser.role === 'leader') return evidence.userId !== currentUser.id; if (currentUser.role === 'internal_committee') return evidence.userId !== currentUser.id; return false; }
        function getUserApprovalStatus(evidence, userId) { if (!evidence.approvals) return 'waiting'; const approval = evidence.approvals.find(a => a.userId === userId); return approval ? approval.status : 'waiting'; }

        async function approveEvidence(evidenceId) {
            const evidence = evidences.find(e => e.id === evidenceId);
            if (!evidence) return;
            if (!canUserApprove(evidence)) { showErrorModal('خطأ', 'لا يمكنك اعتماد هذا الشاهد'); return; }
            try {
                const result = await apiCall('/api/approvals', { method: 'POST', body: { evidenceId, userId: currentUser.id, userName: currentUser.name, role: currentUser.roleLabel, status: 'approved' } });
                if (result.success) {
                    await loadEvidencesFromAPI();
                    showSuccessModal('تم الاعتماد', 'تم اعتماد الشاهد بنجاح', () => showEvidenceApproval());
                }
            } catch (error) { showErrorModal('خطأ', 'تعذر الاعتماد'); }
        }

        async function rejectEvidence(evidenceId) {
            const evidence = evidences.find(e => e.id === evidenceId);
            if (!evidence) return;
            if (!canUserApprove(evidence)) { showErrorModal('خطأ', 'لا يمكنك رفض هذا الشاهد'); return; }
            showTextareaModal('سبب رفض الشاهد', `الشاهد: ${evidence.title}`, 'اكتب سبب الرفض هنا...', '', async (inputValue, textareaValue) => {
                if (!textareaValue || !textareaValue.trim()) { showErrorModal('خطأ', 'الرجاء كتابة سبب الرفض'); return; }
                try {
                    const result = await apiCall('/api/approvals', { method: 'POST', body: { evidenceId, userId: currentUser.id, userName: currentUser.name, role: currentUser.roleLabel, status: 'rejected', reason: textareaValue.trim() } });
                    if (result.success) {
                        await loadEvidencesFromAPI();
                        showSuccessModal('تم الرفض', 'تم رفض الشاهد بنجاح', () => showEvidenceApproval());
                    }
                } catch (error) { showErrorModal('خطأ', 'تعذر الرفض'); }
            });
        }

        function showEvidenceApproval() {
            if (currentUser.role !== 'leader' && currentUser.role !== 'internal_committee') return;
            const container = document.getElementById('evidenceContent'); if(!container) return;
            const pendingEvidences = evidences.filter(e => { if (e.userId === currentUser.id) return false; if (e.status === 'approved') return false; return true; });
            if (pendingEvidences.length === 0) { container.innerHTML = `<div class="etec-card" style="text-align: center; color: var(--text-muted);"><p>لا توجد شواهد بانتظار الاعتماد.</p></div>`; return; }
            container.innerHTML = `
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">اعتماد الشواهد المرفوعة</div></div>
                    <div class="table-responsive">
                        <table class="etec-table">
                            <thead><tr><th>عنوان الشاهد</th><th>مقدم من</th><th>حالتي</th><th>الإجراءات</th></tr></thead>
                            <tbody>${pendingEvidences.map(e => {
                                const myApproval = getUserApprovalStatus(e, currentUser.id);
                                let myStatusBadge = '', myStatusLabel = '';
                                if (myApproval === 'approved') { myStatusBadge = 'badge-status-approved'; myStatusLabel = 'وافقت'; }
                                else if (myApproval === 'rejected') { myStatusBadge = 'badge-status-rejected'; myStatusLabel = 'رفضت'; }
                                else { myStatusBadge = 'badge-status-waiting'; myStatusLabel = 'بانتظار قراري'; }
                                return `<tr>
                                    <td class="evidence-title-cell" data-label="عنوان الشاهد">${e.title}</td>
                                    <td data-label="مقدم من">${e.userName}</td>
                                    <td class="status-cell" data-label="حالتي"><span class="${myStatusBadge}">${myStatusLabel}</span></td>
                                    <td class="actions-cell" data-label="الإجراءات">
                                        <button class="btn-etec-secondary btn-sm" onclick="viewEvidence(${e.id})"><i class="fas fa-eye"></i> عرض</button>
                                        <button class="btn-etec-success btn-sm" onclick="approveEvidence(${e.id})"><i class="fas fa-check"></i> اعتماد</button>
                                        <button class="btn-etec-danger btn-sm" onclick="rejectEvidence(${e.id})"><i class="fas fa-times"></i> رفض</button>
                                    </td>
                                </tr>`;
                            }).join('')}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function showAddEvidenceForm() {
            const availableUsers = users.filter(u => u.role !== 'external_committee');
            document.getElementById('evidenceContent').innerHTML = `
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">نموذج تسجيل شاهد جديد</div></div>
                    <form onsubmit="submitEvidence(event)">
                        <div class="form-group"><label>المجال الرئيسي</label><select id="domainSelect" class="form-control" onchange="updateStandards(); refreshAppendixParentList();" required><option value="">اختر المجال</option>${domains.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}</select></div>
                        <div class="form-group"><label>المعيار</label><select id="standardSelect" class="form-control" onchange="updateIndicators(); refreshAppendixParentList();" required></select></div>
                        <div class="form-group"><label>المؤشر</label><select id="indicatorSelect" class="form-control" onchange="refreshAppendixParentList()" required></select></div>
                        <div class="ready-toggle-box"><input type="checkbox" id="isReadyMadeCheckbox" onchange="toggleReadyMadeMode()"><label for="isReadyMadeCheckbox"><i class="fas fa-file-pdf"></i> لدي شاهد جاهز (مرفق PDF فقط)</label></div>
                        <div class="appendix-toggle-box"><input type="checkbox" id="isAppendixCheckbox" onchange="toggleAppendixMode()"><label for="isAppendixCheckbox"><i class="fas fa-paperclip"></i> هذا الشاهد إلحاقي لشاهد سابق</label></div>
                        <div id="appendixSelectorContainer" style="display: none;">
                            <div class="appendix-selector-box"><label><i class="fas fa-list"></i> اختر الشاهد الأصلي:</label><select id="appendixParentSelect" class="form-control" onchange="fillFromParentEvidence()"><option value="">— اختر المؤشر أولاً لتظهر الشواهد المتاحة —</option></select><div class="appendix-info-box" id="appendixInfoBox" style="display: none; margin-top: 10px;"></div></div>
                            <div class="disabled-fields-hint"><i class="fas fa-info-circle"></i> الحقول التالية معبأة تلقائياً من الشاهد الأصلي وغير قابلة للتعديل. يمكنك فقط رفع المرفقات (الصور وملفات PDF).</div>
                        </div>
                        <div class="form-group"><label>النشاط (عنوان الشاهد)</label><input type="text" id="evTitle" class="form-control" required></div>
                        <div class="form-group" id="descGroup"><label>وصف النشاط وأهدافه</label><textarea id="evDesc" class="form-control" rows="3"></textarea></div>
                        <div class="form-group" id="benefGroup"><label>المستفيدون</label><input type="text" id="evBeneficiaries" class="form-control"></div>
                        <div class="form-group" id="implGroup"><label>المنفذون (يمكن اختيار أكثر من منفذ)</label><select id="evImplementers" class="form-control" multiple style="height: auto; min-height: 100px;">${availableUsers.map(u => `<option value="${u.id}" ${u.id === currentUser.id ? 'selected' : ''}>${u.name} - ${u.roleLabel}</option>`).join('')}</select><small style="color: var(--text-muted); display: block; margin-top: 5px;"><i class="fas fa-info-circle"></i> يمكنك اختيار عدة منفذين بالضغط على Ctrl + النقر. صاحب الحساب محدد تلقائياً.</small></div>
                        <div class="form-group" id="dateGroup"><label>اليوم والتاريخ</label>${buildDateOptionsHtml('ev')}</div>
                        <div class="form-group" id="imagesGroup"><label id="imagesLabel">التوثيق الإعلامي / الصور (اختر حتى 4 صور)</label><input type="file" id="evImages" class="form-control" accept="image/*" multiple></div>
                        <div class="form-group"><label id="pdfLabel">إرفاق ملف PDF</label><input type="file" id="evPdf" class="form-control" accept=".pdf" multiple><small id="pdfHint" style="color: var(--text-muted); display: none; margin-top: 5px;"><i class="fas fa-info-circle"></i> عند الإلحاق يمكنك اختيار أكثر من ملف PDF</small></div>
                        <button type="submit" class="btn-etec-primary" style="width: 100%;">حفظ الشاهد</button>
                    </form>
                </div>
            `;
        }

        function toggleReadyMadeMode() {
            const isReady = document.getElementById('isReadyMadeCheckbox').checked;
            const isAppendixCheckbox = document.getElementById('isAppendixCheckbox');
            if (isReady) { isAppendixCheckbox.checked = false; toggleAppendixMode(); }
            const descGroup = document.getElementById('descGroup');
            const benefGroup = document.getElementById('benefGroup');
            const implGroup = document.getElementById('implGroup');
            const dateGroup = document.getElementById('dateGroup');
            const imagesGroup = document.getElementById('imagesGroup');
            const evDesc = document.getElementById('evDesc');
            const evBeneficiaries = document.getElementById('evBeneficiaries');
            const evImages = document.getElementById('evImages');
            if (isReady) {
                descGroup.style.display = 'none'; benefGroup.style.display = 'none'; implGroup.style.display = 'none';
                dateGroup.style.display = 'none'; imagesGroup.style.display = 'none';
                evDesc.required = false; evBeneficiaries.required = false; evImages.required = false;
                isAppendixCheckbox.disabled = true;
            } else {
                descGroup.style.display = 'block'; benefGroup.style.display = 'block'; implGroup.style.display = 'block';
                dateGroup.style.display = 'block'; imagesGroup.style.display = 'block';
                evDesc.required = true; evBeneficiaries.required = true;
                isAppendixCheckbox.disabled = false;
            }
        }

        function toggleAppendixMode() {
            const checked = document.getElementById('isAppendixCheckbox').checked;
            const isReadyCheckbox = document.getElementById('isReadyMadeCheckbox');
            if (checked) { isReadyCheckbox.checked = false; toggleReadyMadeMode(); }
            const selectorContainer = document.getElementById('appendixSelectorContainer');
            const imagesLabel = document.getElementById('imagesLabel');
            const pdfHint = document.getElementById('pdfHint');
            if (checked) {
                selectorContainer.style.display = 'block';
                imagesLabel.textContent = 'التوثيق الإعلامي / الصور (يمكن اختيار أكثر من 4 صور)';
                pdfHint.style.display = 'block';
                refreshAppendixParentList();
            } else {
                selectorContainer.style.display = 'none';
                imagesLabel.textContent = 'التوثيق الإعلامي / الصور (اختر حتى 4 صور)';
                pdfHint.style.display = 'none';
                ['domainSelect','standardSelect','indicatorSelect','evTitle','evDesc','evBeneficiaries'].forEach(id => { const el = document.getElementById(id); if (el) el.disabled = false; });
                const impl = document.getElementById('evImplementers'); if (impl) impl.disabled = false;
                document.querySelectorAll('input[name="ev_dateType"]').forEach(r => r.disabled = false);
                const dateInput = document.getElementById('ev_dateInput');
                if (dateInput) { const selected = document.querySelector('input[name="ev_dateType"]:checked'); dateInput.disabled = selected && selected.value !== 'specific'; }
                document.getElementById('appendixInfoBox').style.display = 'none';
            }
        }

        function refreshAppendixParentList() {
            if (!document.getElementById('isAppendixCheckbox')?.checked) return;
            const indicatorId = document.getElementById('indicatorSelect').value;
            const select = document.getElementById('appendixParentSelect');
            if (!indicatorId) { select.innerHTML = '<option value="">— اختر المؤشر أولاً —</option>'; return; }
            const candidates = evidences.filter(e => {
                if (e.indicatorId !== indicatorId) return false;
                if (e.userId === currentUser.id) return true;
                if (e.implementers && e.implementers.some(imp => imp.userId === currentUser.id)) return true;
                return false;
            });
            if (candidates.length === 0) { select.innerHTML = '<option value="">— لا توجد شواهد سابقة متاحة لهذا المؤشر —</option>'; }
            else { select.innerHTML = '<option value="">— اختر الشاهد الأصلي —</option>' + candidates.map(e => `<option value="${e.id}">${e.title}</option>`).join(''); }
        }

        function fillFromParentEvidence() {
            const parentId = parseInt(document.getElementById('appendixParentSelect').value);
            const infoBox = document.getElementById('appendixInfoBox');
            const textFields = ['domainSelect','standardSelect','indicatorSelect','evTitle','evDesc','evBeneficiaries'];
            if (!parentId) {
                textFields.forEach(id => { const el = document.getElementById(id); if (el) { el.disabled = false; el.value = ''; } });
                const impl = document.getElementById('evImplementers'); if (impl) impl.disabled = false;
                document.querySelectorAll('input[name="ev_dateType"]').forEach(r => r.disabled = false);
                const dateInput = document.getElementById('ev_dateInput');
                if (dateInput) { const selected = document.querySelector('input[name="ev_dateType"]:checked'); dateInput.disabled = selected && selected.value !== 'specific'; }
                infoBox.style.display = 'none';
                return;
            }
            const parent = evidences.find(e => e.id === parentId);
            if (!parent) return;
            document.getElementById('domainSelect').value = parent.domainId;
            const domain = domains.find(d => d.id === parent.domainId);
            const stdSelect = document.getElementById('standardSelect');
            stdSelect.innerHTML = domain ? domain.standards.map(s => `<option value="${s.id}" ${s.id === parent.standardId ? 'selected' : ''}>${s.name}</option>`).join('') : '';
            const standard = domain?.standards.find(s => s.id === parent.standardId);
            const indSelect = document.getElementById('indicatorSelect');
            indSelect.innerHTML = standard ? standard.indicators.map(i => `<option value="${i.id}" ${i.id === parent.indicatorId ? 'selected' : ''}>${i.name}</option>`).join('') : '';
            document.getElementById('evTitle').value = parent.title;
            document.getElementById('evDesc').value = parent.description || '';
            document.getElementById('evBeneficiaries').value = parent.beneficiaries || '';
            setDateValue('ev', parent.date || '');
            const implSelect = document.getElementById('evImplementers');
            const parentImplIds = parent.implementers ? parent.implementers.map(imp => imp.userId) : [parent.userId];
            Array.from(implSelect.options).forEach(opt => { opt.selected = parentImplIds.includes(parseInt(opt.value)); });
            textFields.forEach(id => { const el = document.getElementById(id); if (el) el.disabled = true; });
            implSelect.disabled = true;
            document.querySelectorAll('input[name="ev_dateType"]').forEach(r => r.disabled = true);
            const dateInput = document.getElementById('ev_dateInput'); if (dateInput) dateInput.disabled = true;
            const implNames = parent.implementers && parent.implementers.length > 0 ? parent.implementers.map(imp => imp.userName).join('، ') : parent.userName;
            infoBox.innerHTML = `<strong>📋 الشاهد الأصلي:</strong> ${parent.title}<br><strong>📅 التاريخ:</strong> ${parent.date} | <strong>👥 المنفذون:</strong> ${implNames}`;
            infoBox.style.display = 'block';
        }

        function updateStandards() {
            const dId = parseInt(document.getElementById('domainSelect').value);
            const d = domains.find(x => x.id === dId);
            const stdSelect = document.getElementById('standardSelect');
            stdSelect.innerHTML = d ? d.standards.map(s => `<option value="${s.id}">${s.name}</option>`).join('') : '<option value="">اختر المعيار</option>';
            updateIndicators();
        }

        function updateIndicators() {
            const dId = parseInt(document.getElementById('domainSelect').value);
            const sId = document.getElementById('standardSelect').value;
            const d = domains.find(x => x.id === dId);
            const s = d ? d.standards.find(x => x.id === sId) : null;
            const indSelect = document.getElementById('indicatorSelect');
            indSelect.innerHTML = s ? s.indicators.map(i => `<option value="${i.id}">${i.name}</option>`).join('') : '<option value="">اختر المؤشر</option>';

        async function submitEvidence(e) {
            e.preventDefault();
            const toBase64 = file => new Promise((resolve) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.readAsDataURL(file); });
            const isReady = document.getElementById('isReadyMadeCheckbox').checked;
            const isAppendix = document.getElementById('isAppendixCheckbox').checked;
            if (isReady) {
                const title = document.getElementById('evTitle').value.trim();
                if (!title) { showErrorModal('تنبيه', 'الرجاء إدخال عنوان الشاهد'); return; }
                const pdfInput = document.getElementById('evPdf').files[0];
                if (!pdfInput) { showErrorModal('تنبيه', 'الرجاء إرفاق ملف PDF'); return; }
                const pdfData = await toBase64(pdfInput);
                const domainId = parseInt(document.getElementById('domainSelect').value);
                const standardId = document.getElementById('standardSelect').value;
                const indicatorId = document.getElementById('indicatorSelect').value;
                if (!domainId || !standardId || !indicatorId) { showErrorModal('تنبيه', 'الرجاء اختيار المجال والمعيار والمؤشر'); return; }
                try {
                    const result = await apiCall('/api/evidences', { method: 'POST', body: { domainId, standardId, indicatorId, title, readyMade: true, pdf: pdfData, images: [], description: '', beneficiaries: '', implementers: [{ userId: currentUser.id, userName: currentUser.name, userRole: currentUser.roleLabel }], date: '', userId: currentUser.id, userName: currentUser.name, userRole: currentUser.roleLabel, status: currentUser.role === 'leader' ? 'approved' : 'pending' } });
                    if (result.success) {
                        await loadEvidencesFromAPI();
                        showSuccessModal('تم الحفظ', 'تم حفظ الشاهد الجاهز', () => showPreviousEvidences());
                    }
                } catch (error) { showErrorModal('خطأ', 'تعذر الحفظ'); }
                return;
            }
            if (isAppendix) {
                const parentId = parseInt(document.getElementById('appendixParentSelect').value);
                if (!parentId) { showErrorModal('تنبيه', 'الرجاء اختيار الشاهد الأصلي من القائمة'); return; }
                const parent = evidences.find(ev => ev.id === parentId);
                if (!parent) { showErrorModal('خطأ', 'لم يتم العثور على الشاهد الأصلي'); return; }
                const filesInput = document.getElementById('evImages').files;
                let images = [];
                for (let i = 0; i < filesInput.length; i++) images.push(await toBase64(filesInput[i]));
                const pdfInput = document.getElementById('evPdf').files;
                let pdfs = [];
                for (let i = 0; i < pdfInput.length; i++) pdfs.push(await toBase64(pdfInput[i]));
                if (images.length === 0 && pdfs.length === 0) { showErrorModal('تنبيه', 'الرجاء إرفاق صورة واحدة على الأقل أو ملف PDF'); return; }
                try {
                    const result = await apiCall('/api/appendices', { method: 'POST', body: { evidenceId: parentId, images, pdfs, userId: currentUser.id, userName: currentUser.name } });
                    if (result.success) {
                        await loadEvidencesFromAPI();
                        showSuccessModal('تم الإلحاق', `تم إلحاق المرفقات بالشاهد: "${parent.title}"`, () => showPreviousEvidences());
                    }
                } catch (error) { showErrorModal('خطأ', 'تعذر الإلحاق'); }
                return;
            }
            const filesInput = document.getElementById('evImages').files;
            let images = [];
            for (let i = 0; i < Math.min(filesInput.length, 4); i++) images.push(await toBase64(filesInput[i]));
            const pdfInput = document.getElementById('evPdf').files[0];
            let pdfData = null;
            if (pdfInput) pdfData = await toBase64(pdfInput);
            const implementersSelect = document.getElementById('evImplementers');
            const selectedImplementerIds = Array.from(implementersSelect.selectedOptions).map(opt => parseInt(opt.value));
            if (!selectedImplementerIds.includes(currentUser.id)) selectedImplementerIds.push(currentUser.id);
            const implementers = selectedImplementerIds.map(id => { const user = users.find(u => u.id === id); return { userId: user.id, userName: user.name, userRole: user.roleLabel }; });
            const dateValue = getDateValue('ev');
            if (!dateValue) { showErrorModal('تنبيه', 'الرجاء اختيار التاريخ'); return; }
            const body = {
                domainId: parseInt(document.getElementById('domainSelect').value),
                standardId: document.getElementById('standardSelect').value,
                indicatorId: document.getElementById('indicatorSelect').value,
                title: document.getElementById('evTitle').value,
                description: document.getElementById('evDesc').value,
                beneficiaries: document.getElementById('evBeneficiaries').value,
                implementers, date: dateValue, images, pdf: pdfData,
                userId: currentUser.id, userName: currentUser.name, userRole: currentUser.roleLabel,
                status: currentUser.role === 'leader' ? 'approved' : 'pending'
            };
            try {
                const result = await apiCall('/api/evidences', { method: 'POST', body });
                if (result.success) {
                    await loadEvidencesFromAPI();
                    showSuccessModal('تم الحفظ', 'تم حفظ الشاهد', () => showPreviousEvidences());
                }
            } catch (error) { showErrorModal('خطأ', 'تعذر الحفظ'); }
        }

            if(!container) return;
            if(evidences.length === 0) { container.innerHTML = `<div class="etec-card" style="text-align: center; color: var(--text-muted);"><p>لا توجد شواهد مسجلة حتى الآن.</p></div>`; return; }
            const userEvidences = currentUser.role === 'leader' ? evidences : evidences.filter(e => { if (e.userId === currentUser.id) return true; if (e.implementers && e.implementers.some(imp => imp.userId === currentUser.id)) return true; return false; });
            const printableEvidences = userEvidences.filter(e => e.status === 'approved' || e.status === 'pending');
            if (userEvidences.length === 0) { container.innerHTML = `<div class="etec-card" style="text-align: center; color: var(--text-muted);"><p>لا توجد شواهد مسجلة من قبلك.</p></div>`; return; }
            const canPrint = currentUser.role !== 'external_committee';
            container.innerHTML = `
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">قائمة الشواهد</div><div style="display: flex; gap: 10px;">${canPrint && printableEvidences.length > 0 ? `<button class="btn-etec-success" onclick="printSelectedEvidences()"><i class="fas fa-print"></i> طباعة المحدد (0)</button>` : ''}</div></div>
                    ${canPrint && printableEvidences.length > 0 ? `<div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;"><button class="btn-etec-secondary btn-sm" onclick="selectAllPrintableEvidences()"><i class="fas fa-check-square"></i> تحديد الكل</button><button class="btn-etec-secondary btn-sm" onclick="deselectAllPrintableEvidences()"><i class="fas fa-square"></i> إلغاء التحديد</button></div>` : ''}
                    <div class="table-responsive">
                        <table class="etec-table">
                            <thead><tr>${canPrint && printableEvidences.length > 0 ? '<th style="width: 40px; text-align: center;"><input type="checkbox" id="printAllCheckbox" class="print-checkbox" onchange="toggleAllPrintCheckboxes()"></th>' : ''}<th>عنوان النشاط</th><th>التاريخ</th><th>المنفذون</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
                            <tbody>
                                ${userEvidences.map(e => {
                                    let statusBadge = '', statusLabel = '', isPrintable = false;
                                    if (e.status === 'approved') { statusBadge = 'badge-status-approved'; statusLabel = 'معتمد'; isPrintable = true; }
                                    else if (e.status === 'rejected') { statusBadge = 'badge-status-rejected'; statusLabel = 'مرفوض'; }
                                    else { statusBadge = 'badge-status-pending'; statusLabel = 'قيد الاعتماد'; isPrintable = true; }
                                    const implementersNames = e.implementers && e.implementers.length > 0 ? e.implementers.map(imp => imp.userName).join('، ') : e.userName;
                                    const canEdit = e.userId === currentUser.id || currentUser.role === 'leader' || (e.implementers && e.implementers.some(imp => imp.userId === currentUser.id));
                                    const canDelete = e.userId === currentUser.id || currentUser.role === 'leader';
                                    const appendicesCount = e.appendices ? e.appendices.length : 0;
                                    const appendixBadge = appendicesCount > 0 ? ` <span style="background: var(--etec-pink); color: white; padding: 2px 8px; border-radius: 8px; font-size: 11px;"><i class="fas fa-paperclip"></i> ${appendicesCount}</span>` : '';
                                    const dateDisplay = e.date || '-';
                                    return `<tr>
                                        ${canPrint && printableEvidences.length > 0 ? `<td class="print-checkbox-cell" data-label="تحديد">${isPrintable ? `<input type="checkbox" class="print-evidence-checkbox print-checkbox" data-evidence-id="${e.id}" onchange="updatePrintButton()">` : '<span style="color: #ccc;">✗</span>'}</td>` : ''}
                                        <td class="evidence-title-cell" data-label="عنوان الشاهد">${e.title}${appendixBadge}</td>
                                        <td data-label="التاريخ">${dateDisplay}</td>
                                        <td data-label="المنفذون">${implementersNames}</td>
                                        <td class="status-cell" data-label="الحالة"><span class="${statusBadge}">${statusLabel}</span></td>
                                        <td class="actions-cell" data-label="الإجراءات">
                                            <button class="btn-etec-secondary btn-sm" onclick="viewEvidence(${e.id})"><i class="fas fa-eye"></i> عرض</button>
                                            ${canEdit ? `<button class="btn-etec-secondary btn-sm" onclick="editEvidence(${e.id})" style="background-color: #27AE60;"><i class="fas fa-edit"></i> تعديل</button>` : ''}
                                            ${canDelete ? `<button class="btn-etec-primary btn-sm" onclick="deleteEvidence(${e.id})" style="background-color: #E74C3C;"><i class="fas fa-trash"></i> حذف</button>` : ''}
                                            ${canPrint && isPrintable ? `<button class="btn-etec-warning btn-sm" onclick="printSingleEvidence(${e.id})" title="طباعة هذا الشاهد"><i class="fas fa-print"></i> طباعة</button>` : ''}
                                        </td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                    ${userEvidences.filter(e => e.status === 'rejected').map(e => {
                        const rejections = e.approvals ? e.approvals.filter(a => a.status === 'rejected') : [];

        function selectAllPrintableEvidences() { document.querySelectorAll('.print-evidence-checkbox').forEach(cb => cb.checked = true); updatePrintButton(); updateMasterCheckbox(); }
        function deselectAllPrintableEvidences() { document.querySelectorAll('.print-evidence-checkbox').forEach(cb => cb.checked = false); updatePrintButton(); updateMasterCheckbox(); }
        function toggleAllPrintCheckboxes() { const master = document.getElementById('printAllCheckbox'); document.querySelectorAll('.print-evidence-checkbox').forEach(cb => cb.checked = master.checked); updatePrintButton(); }
        function updatePrintButton() {
            const selectedCount = document.querySelectorAll('.print-evidence-checkbox:checked').length;
            document.querySelectorAll('[onclick="printSelectedEvidences()"]').forEach(btn => {
                if (selectedCount === 0) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; }
                else { btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; }
                btn.innerHTML = `<i class="fas fa-print"></i> طباعة المحدد (${selectedCount})`;
            });
        }
        function updateMasterCheckbox() {
            const master = document.getElementById('printAllCheckbox'); if (!master) return;
            const checkboxes = document.querySelectorAll('.print-evidence-checkbox');
            const checkedCount = document.querySelectorAll('.print-evidence-checkbox:checked').length;
            if (checkedCount === 0) { master.checked = false; master.indeterminate = false; }
            else if (checkedCount === checkboxes.length) { master.checked = true; master.indeterminate = false; }
            else { master.checked = false; master.indeterminate = true; }
        }

        async function viewEvidence(id) {
            const evidence = evidences.find(e => e.id === id);
            if (!evidence) return;
            const domain = domains.find(d => d.id === evidence.domainId);
            const standard = domain?.standards.find(s => s.id === evidence.standardId);
            const indicator = standard?.indicators.find(i => i.id === evidence.indicatorId);
            let statusBadge = '', statusLabel = '';
            if (evidence.status === 'approved') { statusBadge = 'badge-status-approved'; statusLabel = 'معتمد'; }
            else if (evidence.status === 'rejected') { statusBadge = 'badge-status-rejected'; statusLabel = 'مرفوض'; }
            else { statusBadge = 'badge-status-pending'; statusLabel = 'قيد الاعتماد'; }
            const canPrint = currentUser.role !== 'external_committee' && (evidence.status === 'approved' || evidence.status === 'pending');
            const implementersNames = evidence.implementers && evidence.implementers.length > 0 ? evidence.implementers.map(imp => imp.userName).join('، ') : evidence.userName;
            const pdfTasks = [];
            if (evidence.pdf) pdfTasks.push({ cid: `viewPdfContainer_${evidence.id}`, pdfData: evidence.pdf });
            let appendixPdfHtml = '';
            if (evidence.appendices && evidence.appendices.length > 0) {
                evidence.appendices.forEach((app, appIdx) => {
                    if (app.pdfs && app.pdfs.length > 0) {
                        app.pdfs.forEach((pdfData, pdfIdx) => {
                            const cid = `viewAppendixPdf_${evidence.id}_${appIdx}_${pdfIdx}`;
                            pdfTasks.push({ cid, pdfData });
                            appendixPdfHtml += `<div class="pdf-pages-container" id="${cid}"></div>`;
                        });
                    }
                });
            }
            const progressHtml = pdfTasks.length > 0 ? createProgressBar('viewPdfProgress', pdfTasks.length, 'جاري تحميل المرفقات') : '';
            const imagesHtml = evidence.readyMade ? buildReadyMadeAppendixImagesSingleGrid(evidence) : buildAllImagesGridForView(evidence);
            let html = `
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">عرض الشاهد</div><div style="display: flex; gap: 10px; flex-wrap: wrap;">${canPrint ? `<button class="btn-etec-warning btn-sm" onclick="printSingleEvidence(${evidence.id})"><i class="fas fa-print"></i> طباعة الشاهد</button>` : ''}<button class="btn-etec-secondary btn-sm" onclick="showPreviousEvidences()">رجوع</button></div></div>
                    ${progressHtml}
                    <h3 style="color: var(--etec-primary); margin-bottom: 20px;">${evidence.title}</h3>
                    <p><strong>الحالة:</strong> <span class="${statusBadge}">${statusLabel}</span></p>
            `;
            if (!evidence.readyMade) {
                html += `<p><strong>المجال:</strong> ${domain?.name}</p><p><strong>المعيار:</strong> ${standard?.name}</p><p><strong>المؤشر:</strong> ${indicator?.name}</p><p><strong>الوصف:</strong> ${evidence.description || 'لا يوجد'}</p><p><strong>المستفيدون:</strong> ${evidence.beneficiaries || 'لا يوجد'}</p><p><strong>المنفذون:</strong> ${implementersNames}</p><p><strong>التاريخ:</strong> ${evidence.date}</p><p><strong>الرافع:</strong> ${evidence.userName}</p>`;
            }
            const rejections = evidence.approvals ? evidence.approvals.filter(a => a.status === 'rejected') : [];
            if (rejections.length > 0) html += `<div class="rejection-box" style="margin-top: 15px;"><h4><i class="fas fa-exclamation-triangle"></i> أسباب الرفض:</h4>${rejections.map(r => `<div class="rejection-item"><strong>${r.userName} (${r.role})</strong>: ${r.reason}</div>`).join('')}</div>`;
            html += `<div style="margin-top: 20px;"><strong>حالة الاعتمادات:</strong><div class="table-responsive"><table class="etec-table"><thead><tr><th>المعتمد</th><th>الصفة</th><th>الحالة</th><th>سبب الرفض</th></tr></thead><tbody>`;
            if (evidence.approvals && evidence.approvals.length > 0) {
                evidence.approvals.forEach(a => {
                    let aBadge = '', aLabel = '';
                    if (a.status === 'approved') { aBadge = 'badge-status-approved'; aLabel = 'وافق'; }
                    else if (a.status === 'rejected') { aBadge = 'badge-status-rejected'; aLabel = 'رفض'; }
                    html += `<tr><td>${a.userName}</td><td>${a.role}</td><td><span class="${aBadge}">${aLabel}</span></td><td>${a.reason || '-'}</td></tr>`;
                });
            } else { html += `<tr><td colspan="4" style="text-align: center;">لا توجد اعتمادات بعد</td></tr>`; }
            html += `</tbody></table></div></div>`;
            html += imagesHtml;
            if (evidence.pdf) html += `<div class="pdf-pages-container" id="viewPdfContainer_${evidence.id}"></div>`;
            html += appendixPdfHtml;
            html += `</div>`;
            document.getElementById('evidenceContent').innerHTML = html;
            let completed = 0;
            for (const task of pdfTasks) {
                await renderPdfToCanvas(task.cid, task.pdfData, task.cid);
                completed++;
                updateProgressBar('viewPdfProgress', completed, pdfTasks.length);
            }
            if (pdfTasks.length > 0) setTimeout(() => hideProgressBar('viewPdfProgress'), 800);
        }

        async function deleteEvidence(id) {
            const evidence = evidences.find(e => e.id === id);
            if (!evidence) return;
            if (evidence.userId !== currentUser.id && currentUser.role !== 'leader') { showErrorModal('خطأ', 'فقط الرافع الأصلي للشاهد أو المدير يمكنه حذفه'); return; }
            showConfirmModal('تأكيد الحذف', `هل أنت متأكد من حذف الشاهد "${evidence.title}" بشكل نهائي؟`, async () => {
                try {
                    const result = await apiCall(`/api/evidences/${id}`, { method: 'DELETE' });
                    if (result.success) {
                        await loadEvidencesFromAPI();
                        showSuccessModal('تم الحذف', 'تم حذف الشاهد بنجاح', () => showPreviousEvidences());
                    }
                } catch (error) { showErrorModal('خطأ', 'تعذر الحذف'); }
            });
        }

                document.getElementById('evidenceContent').innerHTML = `

        async function renderPdfToCanvas(evidenceId, pdfData, containerId) {
            try {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';
                const base64 = pdfData.split(',')[1];
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    container.appendChild(canvas);
                }
            } catch (error) { console.error('خطأ في عرض PDF:', error); }
        }

        async function printSelectedEvidences() {
            const selectedIds = [];
            document.querySelectorAll('.print-evidence-checkbox:checked').forEach(cb => selectedIds.push(parseInt(cb.dataset.evidenceId)));
            if (selectedIds.length === 0) { showErrorModal('تنبيه', 'الرجاء تحديد شاهد واحد على الأقل للطباعة'); return; }
            const selectedEvidences = selectedIds.map(id => evidences.find(e => e.id === id)).filter(e => e);
            const sortedEvidences = selectedEvidences.sort((a, b) => {
                const domainOrder = [1, 2, 3, 4];
                const domainDiff = domainOrder.indexOf(a.domainId) - domainOrder.indexOf(b.domainId);
                if (domainDiff !== 0) return domainDiff;
                const standardCompare = a.standardId.localeCompare(b.standardId);
                if (standardCompare !== 0) return standardCompare;
                const indicatorCompare = a.indicatorId.localeCompare(b.indicatorId);
                if (indicatorCompare !== 0) return indicatorCompare;
                const dateKeyA = getDateSortKey(a.date);
                const dateKeyB = getDateSortKey(b.date);
                if (dateKeyA !== dateKeyB) return dateKeyA - dateKeyB;
                return 0;
            });
            let totalPdfs = 0;
            sortedEvidences.forEach(ev => {
                if (ev.pdf) totalPdfs++;
                if (ev.appendices) ev.appendices.forEach(app => { if (app.pdfs) totalPdfs += app.pdfs.length; });
            });
            showPrintProgressModal(`جاري تجهيز ${sortedEvidences.length} شاهد للطباعة...`);
            updatePrintProgress(0, totalPdfs + 1);
            const printWindow = window.open('', '_blank', 'width=900,height=700');
            if (!printWindow) { hidePrintProgressModal(); showErrorModal('خطأ', 'الرجاء السماح بالنوافذ المنبثقة'); return; }
            let reportContent = '';

        function toggleDomainSelection(domainId) {
            const checkbox = document.getElementById(`domain_check_${domainId}`);
            const container = document.getElementById(`standards_container_${domainId}`);
            if (checkbox.checked) container.style.display = 'block'; else container.style.display = 'none';
            const standardCheckboxes = container.querySelectorAll('input[id^="standard_check_"]');
            const indicatorCheckboxes = container.querySelectorAll('input[id^="indicator_check_"]');
            standardCheckboxes.forEach(sc => {
                sc.checked = checkbox.checked;
                const standardId = sc.id.split('_').pop();
                const indicatorsContainer = document.getElementById(`indicators_container_${domainId}_${standardId}`);
                if (indicatorsContainer) indicatorsContainer.style.display = checkbox.checked ? 'block' : 'none';
            });
            indicatorCheckboxes.forEach(ic => ic.checked = checkbox.checked);
        }

        function toggleStandardSelection(domainId, standardId) {
            const checkbox = document.getElementById(`standard_check_${domainId}_${standardId}`);
            const container = document.getElementById(`indicators_container_${domainId}_${standardId}`);
            if (checkbox.checked) {
                container.style.display = 'block';
                document.getElementById(`domain_check_${domainId}`).checked = true;
                document.getElementById(`standards_container_${domainId}`).style.display = 'block';
            } else container.style.display = 'none';
            const indicatorCheckboxes = container.querySelectorAll('input[id^="indicator_check_"]');
            indicatorCheckboxes.forEach(ic => ic.checked = checkbox.checked);
            updateDomainStandardState(domainId, standardId);
        }

        function updateDomainStandardState(domainId, standardId) {
            const indicatorCheckboxes = document.querySelectorAll(`#indicators_container_${domainId}_${standardId} input[id^="indicator_check_"]`);
            const standardCheckbox = document.getElementById(`standard_check_${domainId}_${standardId}`);
            if (indicatorCheckboxes.length > 0) {
                const allChecked = Array.from(indicatorCheckboxes).every(cb => cb.checked);
                const noneChecked = Array.from(indicatorCheckboxes).every(cb => !cb.checked);
                standardCheckbox.checked = allChecked;
                standardCheckbox.indeterminate = !allChecked && !noneChecked;
            }
            updateDomainState(domainId);
        }

        function updateDomainState(domainId) {
            const standardCheckboxes = document.querySelectorAll(`#standards_container_${domainId} input[id^="standard_check_"]`);
            const domainCheckbox = document.getElementById(`domain_check_${domainId}`);
            if (standardCheckboxes.length > 0) {
                const allChecked = Array.from(standardCheckboxes).every(cb => cb.checked);
                const noneChecked = Array.from(standardCheckboxes).every(cb => !cb.checked);
                domainCheckbox.checked = allChecked;
                domainCheckbox.indeterminate = !allChecked && !noneChecked;
            }
        }

        function selectAllIndicators() {
            document.querySelectorAll('input[id^="indicator_check_"]').forEach(cb => cb.checked = true);

                document.getElementById(`domain_check_${domain.id}`).checked = true;
                document.getElementById(`standards_container_${domain.id}`).style.display = 'block';
