<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاعتماد المدرسي</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        :root {
            --etec-primary: #3A2375;
            --etec-pink: #C82269;
            --etec-orange: #E77B26;
            --bg-main: #F4F5F8;
            --bg-card: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #1A1A1A;
            --text-muted: #64748B;
            --font-family-arabic: 'Cairo', system-ui, sans-serif;
            --status-pending: #E77B26;
            --status-approved: #27AE60;
            --status-rejected: #C82269;
            --status-waiting: #64748B;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-family-arabic);
            background-color: var(--bg-main);
            color: var(--text-main);
            direction: rtl;
            text-align: right;
            min-height: 100vh;
        }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a3e 0%, #3A2375 30%, #6B4897 60%, #C82269 100%);
            padding: 20px;
        }
        
        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            gap: 25px;
        }
        
        .login-hero { text-align: center; color: white; }
        
        .school-logo-top {
            width: 80px; height: 80px; border-radius: 50%;
            background: white; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; border: 3px solid var(--etec-pink);
        }
        
        .school-logo-top i { font-size: 40px; color: var(--etec-primary); }
        
        .login-hero h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
        .login-hero p { font-size: 14px; opacity: 0.9; }
        
        .login-card {
            background: white; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%; max-width: 420px; overflow: hidden;
        }
        
        .login-card-body { padding: 30px; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
        
        .form-control {
            width: 100%; padding: 12px 15px;
            border: 2px solid var(--border-color); border-radius: 10px;
            font-family: var(--font-family-arabic); font-size: 14px;
            background: #fafafa;
        }
        
        .login-btn {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, var(--etec-pink), #E73C7E);
            color: white; border: none; border-radius: 10px;
            font-family: var(--font-family-arabic); font-size: 15px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        
        .login-footer { text-align: center; color: rgba(255, 255, 255, 0.9); }
        .rights-text { font-size: 13px; font-weight: 700; color: white; }
        .developer-text { font-size: 11px; color: rgba(255, 255, 255, 0.8); }
        .footer-divider { width: 70%; height: 1px; background: rgba(255, 255, 255, 0.3); margin: 8px auto; }

        .app-container { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 280px; background: var(--etec-primary);
            color: white; position: fixed; top: 0; right: 0; bottom: 0;
            z-index: 1000; overflow-y: auto;
        }
        
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .sidebar-header h2 { font-size: 20px; font-weight: 700; }
        .sidebar-header p { font-size: 13px; opacity: 0.8; }
        .sidebar-menu { padding: 20px 0; }
        
        .menu-item {
            padding: 15px 20px; display: flex; align-items: center;
            cursor: pointer; border-right: 4px solid transparent;
        }
        
        .menu-item:hover, .menu-item.active {
            background: rgba(255,255,255,0.15); border-right-color: var(--etec-pink);
        }
        
        .menu-item i { margin-left: 15px; font-size: 20px; width: 24px; }
        .menu-item span { font-size: 15px; font-weight: 600; }
        
        .main-content { flex: 1; margin-right: 280px; display: flex; flex-direction: column; min-height: 100vh; }
        
        .top-header {
            background: var(--bg-card); border-bottom: 2px solid var(--border-color);
            padding: 15px 30px; display: flex; align-items: center;
            position: sticky; top: 0; z-index: 999;
        }
        
        .user-greeting { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            background: var(--etec-pink); color: white; width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .user-greeting-text { font-size: 16px; font-weight: 700; }
        .user-role-text { font-size: 13px; color: var(--text-muted); }
        
        .content-body { padding: 30px; flex: 1; }
        
        .content-header {
            background: var(--bg-card); border-radius: 12px; padding: 20px;
            margin-bottom: 20px;
        }
        .content-header h1 { color: var(--etec-primary); font-size: 24px; font-weight: 700; }
        
        .etec-card {
            background: var(--bg-card); border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px; margin-bottom: 20px;
        }
        
        .etec-card-header {
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid var(--bg-main);
            padding-bottom: 15px; margin-bottom: 15px;
        }
        .etec-card-title { color: var(--etec-primary); font-weight: 700; font-size: 18px; }
        
        .btn-etec-primary, .btn-etec-secondary, .btn-etec-warning, .btn-etec-success, .btn-etec-danger {
            font-family: var(--font-family-arabic); font-weight: 600;
            padding: 10px 20px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 15px;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; min-width: 120px;
        }
        
        .btn-etec-primary { background-color: var(--etec-pink); color: #fff; }
        .btn-etec-secondary { background-color: var(--etec-primary); color: #fff; }
        .btn-etec-warning { background-color: var(--status-pending); color: #fff; }
        .btn-etec-success { background-color: var(--status-approved); color: #fff; padding: 5px 15px; min-width: auto; }
        .btn-etec-danger { background-color: var(--status-rejected); color: #fff; padding: 5px 15px; min-width: auto; }
        
        .btn-sm { padding: 5px 10px; font-size: 13px; min-width: auto; border-radius: 6px; }
        
        .etec-table {
            width: 100%; border-collapse: collapse;
            margin: 15px 0; background-color: var(--bg-card);
            border-radius: 8px; overflow: hidden;
        }
        .etec-table th {
            background-color: var(--etec-primary); color: white;
            padding: 12px; font-weight: 600; text-align: right;
        }
        .etec-table td { padding: 12px; border-bottom: 1px solid var(--border-color); }
        
        .badge-status-pending { background-color: var(--status-pending); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .badge-status-approved { background-color: var(--status-approved); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .badge-status-rejected { background-color: var(--status-rejected); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .badge-status-waiting { background-color: var(--status-waiting); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        
        .badge-level { display: inline-block; padding: 4px 12px; border-radius: 12px; font-weight: 600; font-size: 12px; color: white; }
        .badge-low { background-color: #E74C3C; }
        .badge-medium { background-color: #F39C12; }
        .badge-high { background-color: #3498DB; }
        .badge-very-high { background-color: #27AE60; }
        .badge-no-evidence { background-color: #95A5A6; }
        
        .rejection-box { background: #fff0f5; border: 2px solid var(--status-rejected); border-radius: 8px; padding: 15px; margin: 10px 0; }
        .rejection-box h4 { color: var(--status-rejected); margin-bottom: 10px; }
        .rejection-item { padding: 8px; border-bottom: 1px solid #ffd6e7; }
        
        .modal-overlay {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(0, 0, 0, 0.6); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
        }
        
        .modal-content {
            background: white; border-radius: 16px;
            width: 90%; max-width: 500px; overflow: hidden;
        }
        
        .modal-header {
            padding: 20px 25px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 2px solid #f0f0f0;
        }
        .modal-header.success { background: linear-gradient(135deg, #27AE60, #1F7A4C); }
        .modal-header.danger { background: linear-gradient(135deg, #E74C3C, #C0392B); }
        .modal-header.warning { background: linear-gradient(135deg, #F39C12, #E67E22); }
        .modal-header.primary { background: linear-gradient(135deg, #3A2375, #6B4897); }
        
        .modal-header .modal-icon { color: white; font-size: 22px; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); }
        .modal-header .modal-title { color: white; font-size: 18px; font-weight: 700; flex: 1; margin-right: 15px; }
        .modal-close-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }
        
        .modal-body { padding: 25px; }
        .modal-message { font-size: 15px; line-height: 1.8; margin-bottom: 20px; }
        .modal-input { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px; font-family: var(--font-family-arabic); margin-bottom: 15px; }
        .modal-select { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px; font-family: var(--font-family-arabic); margin-bottom: 15px; }
        .modal-textarea { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px; font-family: var(--font-family-arabic); min-height: 100px; }
        .modal-footer { padding: 15px 25px; display: flex; gap: 10px; justify-content: flex-end; border-top: 2px solid #f0f0f0; }
        .modal-btn { font-family: var(--font-family-arabic); font-weight: 600; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; min-width: 100px; }
        .modal-btn-primary { background-color: var(--etec-primary); color: white; }
        .modal-btn-success { background-color: #27AE60; color: white; }
        .modal-btn-danger { background-color: #E74C3C; color: white; }
        .modal-btn-secondary { background-color: #E2E8F0; color: var(--text-main); }
        
        .modal-form-group { margin-bottom: 15px; }
        .modal-form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        
        .print-checkbox { width: 18px; height: 18px; cursor: pointer; }
        
        .report-page { background: #fff; padding: 40px; padding-bottom: 80px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; page-break-after: always; position: relative; min-height: 600px; }
        .cover-domain { display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; background: var(--etec-primary); color: white; }
        .cover-domain h1 { font-size: 48px; font-weight: 800; }
        .cover-indicator { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; background: #fafafa; border: 8px solid var(--etec-primary); }
        .cover-indicator h2 { font-size: 32px; color: #6B4897; }
        .cover-indicator h3 { font-size: 24px; color: #2A72B5; }
        .activity-title { text-align: center; font-size: 22px; font-weight: 700; color: var(--etec-primary); margin-bottom: 20px; border-bottom: 2px solid var(--etec-pink); padding-bottom: 10px; }
        .activity-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .activity-table th, .activity-table td { border: 1px solid var(--border-color); padding: 10px; line-height: 1.8; }
        .activity-table th { background-color: #f4f5f8; width: 30%; }
        .images-grid-1 { display: flex; justify-content: center; }
        .images-grid-1 .media-image { width: 40%; }
        .images-grid-2, .images-grid-3, .images-grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .media-image img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
        .principal-signature { position: absolute; bottom: 15px; left: 40px; font-weight: 700; }
        .pdf-pages-container canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        
        .selection-tree { margin-top: 15px; }
        .domain-selection { margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; background: #fafafa; }
        .domain-selection-header { display: flex; align-items: center; cursor: pointer; }
        .standard-selection { margin: 10px 25px 10px 0; padding: 10px; border-right: 3px solid var(--border-color); }
        .standard-selection-header { display: flex; align-items: center; cursor: pointer; font-weight: 600; }
        .indicator-selection { margin: 5px 45px 5px 0; display: flex; align-items: center; }

        @media print {
            body { background: white; }
            .sidebar, .content-header, .no-print, .top-header { display: none !important; }
            .main-content { margin-right: 0 !important; }
            .content-body { padding: 0 !important; }
            .report-page { border: none; padding: 20px; page-break-after: always; }
            .cover-domain { background: #3A2375 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .etec-table th { background-color: var(--etec-primary) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <div id="loginPage" class="login-container">
        <div class="login-wrapper">
            <div class="login-hero">
                <div class="school-logo-top"><i class="fas fa-school"></i></div>
                <h1>منصة الاعتماد المدرسي</h1>
                <p>نظام متكامل لإدارة الشواهد والتقارير وفق معايير هيئة تقويم التعليم والتدريب</p>
            </div>
            <div class="login-card">
                <div class="login-card-body">
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label>اسم المستخدم</label>
                            <input type="text" id="username" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>كلمة المرور</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>
                        <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</button>
                    </form>
                </div>
            </div>
            <div class="login-footer">
                <p class="rights-text">جميع الحقوق محفوظة لمدرسة عمرو بن العاص الابتدائية</p>
                <div class="footer-divider"></div>
                <p class="developer-text">برمجة وفكرة معلم صعوبات التعلم: الأستاذ صالح عبد العزيز عبد الله العجلان</p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="app-container" style="display: none;">
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">

            <div id="sidebarMenu" class="sidebar-menu"></div>
        </div>

                        <div class="user-greeting-text" id="headerUserName"></div>
                        <div class="user-role-text" id="headerUserRole"></div>
                    </div>
                </div>
            </div>
            <div class="content-body">
                <div id="contentArea"></div>
            </div>
        </div>
    </div>

                return true;
            } catch (error) {

        function showCustomModal({ type = 'info', title = '', message = '', icon = 'fa-info-circle', confirmText = 'موافق', cancelText = 'إلغاء', showCancel = false, onConfirm = null, onCancel = null, input = null, textarea = null }) {
            const iconMap = { 'success': 'fa-check-circle', 'danger': 'fa-exclamation-triangle', 'warning': 'fa-exclamation-circle', 'info': 'fa-info-circle', 'primary': 'fa-bell' };
            const finalIcon = icon || iconMap[type] || 'fa-info-circle';
            const headerClass = type || 'info';
            let bodyContent = '';
            if (message) bodyContent += `<div class="modal-message">${message}</div>`;
            if (input) bodyContent += `<input type="text" id="modalInputField" class="modal-input" placeholder="${input.placeholder || ''}" value="${input.value || ''}">`;
            if (textarea) bodyContent += `<textarea id="modalTextareaField" class="modal-textarea" placeholder="${textarea.placeholder || ''}">${textarea.value || ''}</textarea>`;
            
            const modalHtml = `
                <div class="modal-overlay" id="customModal">
                    <div class="modal-content">
                        <div class="modal-header ${headerClass}">
                            <div class="modal-icon"><i class="fas ${finalIcon}"></i></div>
                            <div class="modal-title">${title}</div>
                            <button class="modal-close-btn" onclick="closeCustomModal()"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="modal-body">${bodyContent}</div>
                        <div class="modal-footer">
                            <button class="modal-btn modal-btn-primary" onclick="confirmCustomModal()"><i class="fas fa-check"></i> ${confirmText}</button>
                            ${showCancel ? `<button class="modal-btn modal-btn-secondary" onclick="cancelCustomModal()"><i class="fas fa-times"></i> ${cancelText}</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            window._modalCallbacks = { onConfirm, onCancel };
            document.getElementById('customModal').addEventListener('click', function(e) {
                if (e.target === this) { closeCustomModal(); if (window._modalCallbacks.onCancel) window._modalCallbacks.onCancel(); }
            });
            if (input) setTimeout(() => { const f = document.getElementById('modalInputField'); if (f) f.focus(); }, 100);
            if (textarea) setTimeout(() => { const f = document.getElementById('modalTextareaField'); if (f) f.focus(); }, 100);
        }
        
        function closeCustomModal() { const m = document.getElementById('customModal'); if (m) m.remove(); }
        
        function confirmCustomModal() {
            const callbacks = window._modalCallbacks || {};
            let inputValue = null, textareaValue = null;
            const inputField = document.getElementById('modalInputField');
            if (inputField) inputValue = inputField.value;
            const textareaField = document.getElementById('modalTextareaField');
            if (textareaField) textareaValue = textareaField.value;
            closeCustomModal();
            if (callbacks.onConfirm) callbacks.onConfirm(inputValue, textareaValue);
        }
        
        function cancelCustomModal() { const callbacks = window._modalCallbacks || {}; closeCustomModal(); if (callbacks.onCancel) callbacks.onCancel(); }
        function showSuccessModal(title, message, onConfirm = null) { showCustomModal({ type: 'success', title, message, icon: 'fa-check-circle', confirmText: 'موافق', showCancel: false, onConfirm }); }
        function showErrorModal(title, message, onConfirm = null) { showCustomModal({ type: 'danger', title, message, icon: 'fa-exclamation-triangle', confirmText: 'موافق', showCancel: false, onConfirm }); }
        function showConfirmModal(title, message, onConfirm, onCancel = null) { showCustomModal({ type: 'warning', title, message, icon: 'fa-exclamation-circle', confirmText: 'تأكيد', cancelText: 'إلغاء', showCancel: true, onConfirm, onCancel }); }
        function showInputModal(title, message, placeholder, value, onConfirm, onCancel = null) { showCustomModal({ type: 'primary', title, message, icon: 'fa-edit', confirmText: 'حفظ', cancelText: 'إلغاء', showCancel: true, input: { placeholder, value }, onConfirm, onCancel }); }
        function showTextareaModal(title, message, placeholder, value, onConfirm, onCancel = null) { showCustomModal({ type: 'danger', title, message, icon: 'fa-comment-alt', confirmText: 'تأكيد الرفض', cancelText: 'إلغاء', showCancel: true, textarea: { placeholder, value }, onConfirm, onCancel }); }

        // ============ نظام الاعتماد ============
        function getRequiredApprovers(evidence) {
            const approvers = [];
            users.filter(u => u.role === 'internal_committee' && u.id !== evidence.userId).forEach(u => approvers.push({ userId: u.id, userName: u.name, role: u.roleLabel, status: 'waiting' }));
            users.filter(u => u.role === 'leader' && u.id !== evidence.userId).forEach(u => approvers.push({ userId: u.id, userName: u.name, role: u.roleLabel, status: 'waiting' }));
            return approvers;
        }
        function isFullyApproved(evidence) {
            if (!evidence.approvals || evidence.approvals.length === 0) return false;
            const required = getRequiredApprovers(evidence);
            if (required.length === 0) return true;
            return required.every(req => {
                const approval = evidence.approvals.find(a => a.userId === req.userId);
                return approval && approval.status === 'approved';
            });
        }
        function hasRejection(evidence) { return evidence.approvals && evidence.approvals.some(a => a.status === 'rejected'); }
        function getEvidenceFinalStatus(evidence) { if (hasRejection(evidence)) return 'rejected'; if (isFullyApproved(evidence)) return 'approved'; return 'pending'; }
        function updateEvidenceStatus(evidence) { evidence.status = getEvidenceFinalStatus(evidence); }
        function canUserApprove(evidence) { if (currentUser.role === 'leader') return evidence.userId !== currentUser.id; if (currentUser.role === 'internal_committee') return evidence.userId !== currentUser.id; return false; }
        function getUserApprovalStatus(evidence, userId) { if (!evidence.approvals) return 'waiting'; const approval = evidence.approvals.find(a => a.userId === userId); return approval ? approval.status : 'waiting'; }
        
        async function approveEvidence(evidenceId) {
            const evidence = evidences.find(e => e.id === evidenceId);
            if (!evidence) return;
            if (!canUserApprove(evidence)) { showErrorModal('خطأ', 'لا يمكنك اعتماد هذا الشاهد'); return; }
            if (!evidence.approvals) evidence.approvals = [];
            evidence.approvals = evidence.approvals.filter(a => a.userId !== currentUser.id);
            evidence.approvals.push({ userId: currentUser.id, userName: currentUser.name, role: currentUser.roleLabel, status: 'approved', date: new Date().toISOString() });
            updateEvidenceStatus(evidence);
            await updateEvidenceInDb(evidence);
            showSuccessModal('تم الاعتماد', 'تم اعتماد الشاهد بنجاح', () => showEvidenceApproval());
        }
        
        async function rejectEvidence(evidenceId) {
            const evidence = evidences.find(e => e.id === evidenceId);
            if (!evidence) return;
            if (!canUserApprove(evidence)) { showErrorModal('خطأ', 'لا يمكنك رفض هذا الشاهد'); return; }
            showTextareaModal('سبب رفض الشاهد', `الشاهد: ${evidence.title}`, 'اكتب سبب الرفض هنا...', '', async (inputValue, textareaValue) => {
                if (!textareaValue || !textareaValue.trim()) { showErrorModal('خطأ', 'الرجاء كتابة سبب الرفض'); return; }
                if (!evidence.approvals) evidence.approvals = [];
                evidence.approvals = evidence.approvals.filter(a => a.userId !== currentUser.id);
                evidence.approvals.push({ userId: currentUser.id, userName: currentUser.name, role: currentUser.roleLabel, status: 'rejected', reason: textareaValue.trim(), date: new Date().toISOString() });
                updateEvidenceStatus(evidence);
                await updateEvidenceInDb(evidence);
                showSuccessModal('تم الرفض', 'تم رفض الشاهد بنجاح', () => showEvidenceApproval());
            });
        }

        async function submitEvidence(e) {
            e.preventDefault();
            const evidenceId = Date.now().toString();
            const images = [];
            const filesInput = document.getElementById('evImages').files;
            for (let i = 0; i < Math.min(filesInput.length, 4); i++) {
                const url = await uploadImageToStorage(filesInput[i], evidenceId);
                if (url) images.push(url);
            }
            const pdfInput = document.getElementById('evPdf').files[0];
            let pdfUrl = null;
            if (pdfInput) pdfUrl = await uploadPdfToStorage(pdfInput, evidenceId);
            
            const implementersSelect = document.getElementById('evImplementers');
            const selectedIds = Array.from(implementersSelect.selectedOptions).map(opt => parseInt(opt.value));
            if (!selectedIds.includes(currentUser.id)) selectedIds.push(currentUser.id);
            const implementers = selectedIds.map(id => { const u = users.find(x => x.id === id); return { userId: u.id, userName: u.name, userRole: u.roleLabel }; });
            
            const newEvidence = {
                id: evidenceId,
                domainId: parseInt(document.getElementById('domainSelect').value),
                standardId: document.getElementById('standardSelect').value,
                indicatorId: document.getElementById('indicatorSelect').value,
                title: document.getElementById('evTitle').value,
                description: document.getElementById('evDesc').value,
                beneficiaries: document.getElementById('evBeneficiaries').value,
                implementers: implementers,
                date: document.getElementById('evDate').value,
                images: images,
                pdf: pdfUrl,
                userId: currentUser.id,
                userName: currentUser.name,
                userRole: currentUser.roleLabel,
                status: currentUser.role === 'leader' ? 'approved' : 'pending',
                approvals: []
            };
            
            const saved = await saveEvidenceToDb(newEvidence);

        async function updateEvidence(e, id) {
            e.preventDefault();
            const evidence = evidences.find(ev => ev.id === id);
            if (!evidence) return;
            
            const images = evidence.images || [];
            const filesInput = document.getElementById('editEvImages').files;
            for (let i = 0; i < Math.min(filesInput.length, 4); i++) {
                const url = await uploadImageToStorage(filesInput[i], id);
                if (url) images.push(url);
            }
            const pdfInput = document.getElementById('editEvPdf').files[0];
            let pdfUrl = evidence.pdf;
            if (pdfInput) pdfUrl = await uploadPdfToStorage(pdfInput, id);
            
            const implementersSelect = document.getElementById('editEvImplementers');
            const selectedIds = Array.from(implementersSelect.selectedOptions).map(opt => parseInt(opt.value));
            if (!selectedIds.includes(evidence.userId)) selectedIds.push(evidence.userId);
            const implementers = selectedIds.map(uid => { const u = users.find(x => x.id === uid); return { userId: u.id, userName: u.name, userRole: u.roleLabel }; });
            
            evidence.domainId = parseInt(document.getElementById('editDomainSelect').value);
            evidence.standardId = document.getElementById('editStandardSelect').value;
            evidence.indicatorId = document.getElementById('editIndicatorSelect').value;
            evidence.title = document.getElementById('editEvTitle').value;
            evidence.description = document.getElementById('editEvDesc').value;
            evidence.beneficiaries = document.getElementById('editEvBeneficiaries').value;
            evidence.implementers = implementers;
            evidence.date = document.getElementById('editEvDate').value;
            evidence.images = images;
            evidence.pdf = pdfUrl;
            evidence.approvals = [];
            evidence.status = currentUser.role === 'leader' ? 'approved' : 'pending';
            
            const updated = await updateEvidenceInDb(evidence);
            if (updated) showSuccessModal('تم التحديث', 'تم تحديث الشاهد', () => showPreviousEvidences());
            else showErrorModal('خطأ', 'فشل في التحديث');

        function getImagesGridHtml(images) {
            if (!images || images.length === 0) return '';
            const gridClass = `images-grid-${images.length}`;
            let html = `<div class="${gridClass}">`;
            images.forEach(img => { html += `<div class="media-image"><img src="${img}" alt="صورة"></div>`; });

        async function renderPdfToCanvas(evidenceId, pdfData, containerId) {
            try {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';
                let pdf;
                if (pdfData.startsWith('data:')) {
                    const base64 = pdfData.split(',')[1];
                    const binaryString = atob(base64);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
                } else {
                    pdf = await pdfjsLib.getDocument(pdfData).promise;
                }
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    container.appendChild(canvas);
                }
            } catch (error) { console.error('خطأ في عرض PDF:', error); }
        }

                        ${ev.images && ev.images.length > 0 ? `<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px;">${ev.images.map(img => `<img src="${img}" style="width: 100%; height: 200px; object-fit: cover;">`).join('')}</div>` : ''}
                        <div style="margin-top: 40px; text-align: left; font-weight: 700;">مدير المدرسة: أ / عمر عبد الله الحماد</div>
                    </div>
                `;
            });
            
            printWindow.document.write(`
                <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
                <title>ملف الإنجاز</title>
                <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { font-family: 'Cairo', sans-serif; direction: rtl; text-align: right; padding: 20px; }
                </style></head><body>${reportContent}</body></html>
            `);
            printWindow.document.close();
            setTimeout(() => printWindow.print(), 500);
        }

        function showReports() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="content-header"><h1>تقارير الاعتماد المدرسي</h1></div>
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">إنشاء تقرير</div></div>
                    <p style="color: var(--text-muted);">اختر المؤشرات المطلوبة</p>
                    <div class="selection-tree">
                        ${domains.map(domain => `
                            <div class="domain-selection">
                                <div class="domain-selection-header" onclick="toggleDomainSelection(${domain.id})">
                                    <input type="checkbox" id="domain_check_${domain.id}" onchange="toggleDomainSelection(${domain.id})" onclick="event.stopPropagation()">
                                    <strong style="margin-right: 10px;">${domain.name}</strong>
                                </div>
                                <div id="standards_container_${domain.id}" style="display: none;">
                                    ${domain.standards.map(standard => `
                                        <div class="standard-selection">
                                            <div class="standard-selection-header" onclick="toggleStandardSelection(${domain.id}, '${standard.id}')">
                                                <input type="checkbox" id="standard_check_${domain.id}_${standard.id}" onclick="event.stopPropagation()">
                                                <span style="margin-right: 10px;">${standard.name}</span>
                                            </div>
                                            <div id="indicators_container_${domain.id}_${standard.id}" style="display: none;">
                                                ${standard.indicators.map(indicator => `
                                                    <div class="indicator-selection">
                                                        <input type="checkbox" id="indicator_check_${indicator.id}">
                                                        <span style="margin-right: 10px;">${indicator.name}</span>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="margin-top: 20px; display: flex; gap: 10px;">
                        <button class="btn-etec-primary" onclick="generateReport()">إنشاء التقرير</button>
                        <button class="btn-etec-secondary" onclick="selectAllIndicators()">اختيار الكل</button>
                        <button class="btn-etec-secondary" onclick="deselectAllIndicators()">إلغاء الاختيار</button>
                    </div>
                </div>
            `;
        }

        function toggleDomainSelection(domainId) {
            const checkbox = document.getElementById(`domain_check_${domainId}`);
            const container = document.getElementById(`standards_container_${domainId}`);
            container.style.display = checkbox.checked ? 'block' : 'none';
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = checkbox.checked);
        }

        function toggleStandardSelection(domainId, standardId) {
            const checkbox = document.getElementById(`standard_check_${domainId}_${standardId}`);
            const container = document.getElementById(`indicators_container_${domainId}_${standardId}`);
            container.style.display = checkbox.checked ? 'block' : 'none';
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = checkbox.checked);
        }

        function selectAllIndicators() {
            document.querySelectorAll('input[id^="indicator_check_"]').forEach(cb => cb.checked = true);
            document.querySelectorAll('input[id^="standard_check_"]').forEach(cb => cb.checked = true);
            document.querySelectorAll('input[id^="domain_check_"]').forEach(cb => cb.checked = true);
            domains.forEach(domain => {
                document.getElementById(`standards_container_${domain.id}`).style.display = 'block';
                domain.standards.forEach(standard => {
                    document.getElementById(`indicators_container_${domain.id}_${standard.id}`).style.display = 'block';
                });
            });
        }

        function deselectAllIndicators() {
            document.querySelectorAll('input[id^="indicator_check_"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('input[id^="standard_check_"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('input[id^="domain_check_"]').forEach(cb => cb.checked = false);
            domains.forEach(domain => {
                document.getElementById(`standards_container_${domain.id}`).style.display = 'none';
                domain.standards.forEach(standard => {
                    document.getElementById(`indicators_container_${domain.id}_${standard.id}`).style.display = 'none';
                });
            });
        }

        function generateReport() {
            const selectedIndicators = [];
            document.querySelectorAll('input[id^="indicator_check_"]:checked').forEach(cb => selectedIndicators.push(cb.id.replace('indicator_check_', '')));
            if (selectedIndicators.length === 0) { showErrorModal('تنبيه', 'اختر مؤشر واحد على الأقل'); return; }
            
            let html = '';
            let hasData = false;
            domains.forEach(d => {
                let domainHasData = false;
                d.standards.forEach(s => {
                    s.indicators.forEach(ind => {
                        if (selectedIndicators.includes(ind.id)) {
                            const evs = evidences.filter(e => e.indicatorId === ind.id && e.status === 'approved');
                            if (evs.length > 0) domainHasData = true;
                        }
                    });
                });
                if (domainHasData) {
                    hasData = true;
                    html += `<div class="report-page cover-domain"><h1>${d.name}</h1></div>`;
                    d.standards.forEach(s => {
                        s.indicators.forEach(ind => {
                            if (selectedIndicators.includes(ind.id)) {
                                const evs = evidences.filter(e => e.indicatorId === ind.id && e.status === 'approved');
                                if (evs.length > 0) {
                                    html += `<div class="report-page cover-indicator"><h2>${s.name}</h2><h3>${ind.name}</h3></div>`;
                                    evs.forEach(ev => {
                                        const implementersNames = ev.implementers && ev.implementers.length > 0 ? ev.implementers.map(imp => imp.userName).join('، ') : ev.userName;
                                        html += `
                                            <div class="report-page">
                                                <div class="activity-title">${ev.title}</div>
                                                <table class="activity-table">
                                                    <tr><th>الوصف</th><td>${ev.description}</td></tr>
                                                    <tr><th>المستفيدون</th><td>${ev.beneficiaries}</td></tr>
                                                    <tr><th>المنفذون</th><td>${implementersNames}</td></tr>
                                                    <tr><th>التاريخ</th><td>${ev.date}</td></tr>
                                                </table>
                                                ${ev.images && ev.images.length > 0 ? getImagesGridHtml(ev.images) : ''}
                                                <div class="principal-signature">مدير المدرسة: أ / عمر عبد الله الحماد</div>
                                            </div>
                                        `;
                                    });
                                }
                            }
                        });
                    });
                }
            });
            
            if (!hasData) html = `<div class="etec-card" style="text-align: center;"><h3>لا توجد شواهد معتمدة</h3></div>`;
            
            const reportContent = document.createElement('div');
            reportContent.innerHTML = html;
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `<div class="no-print" style="margin-bottom: 20px;"><button class="btn-etec-primary" onclick="printReport()"><i class="fas fa-print"></i> طباعة التقرير</button></div>`;
            contentArea.appendChild(reportContent);
        }

        function printReport() { window.print(); }

        // تهيئة المنصة
        document.addEventListener('DOMContentLoaded', function() {
            // المنصة جاهزة
        });
    </script>
</body>
</html>
