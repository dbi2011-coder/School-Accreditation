                            <select id="evImplementers" class="form-control" multiple style="height: auto; min-height: 100px;">
                                ${availableUsers.map(u => `<option value="${u.id}" ${u.id === currentUser.id ? 'selected' : ''}>${u.name} - ${u.roleLabel}</option>`).join('')}
                            </select>
                            <small style="color: var(--text-muted); display: block; margin-top: 5px;"><i class="fas fa-info-circle"></i> يمكنك اختيار عدة منفذين بالضغط على Ctrl + النقر. صاحب الحساب محدد تلقائياً.</small>
                        </div>
                        <div class="form-group"><label>اليوم والتاريخ</label><input type="date" id="evDate" class="form-control" required></div>
                        <div class="form-group"><label>التوثيق الإعلامي / الصور (اختر حتى 4 صور)</label><input type="file" id="evImages" class="form-control" accept="image/*" multiple></div>
                        <div class="form-group"><label>إرفاق ملف PDF (اختياري)</label><input type="file" id="evPdf" class="form-control" accept=".pdf"></div>
                        <div id="uploadStatus" style="margin: 10px 0;"></div>
                        <button type="submit" class="btn-etec-primary" id="submitEvidenceBtn"><i class="fas fa-save"></i> حفظ الشاهد</button>
                    </form>
                </div>
            `;
            
            document.getElementById('evImages').addEventListener('change', function() {
                updateUploadStatus(this.files, 'images');
            });
            document.getElementById('evPdf').addEventListener('change', function() {
                updateUploadStatus(this.files, 'pdf');
            });
        }

        function updateUploadStatus(files, type) {
            const statusDiv = document.getElementById('uploadStatus');
            if (!statusDiv) return;
            if (files.length === 0) {
                statusDiv.innerHTML = '';
                return;
            }
            let html = `<div class="file-upload-status"><i class="fas fa-upload"></i> تم اختيار `;
            if (type === 'images') {
                html += `${files.length} صورة`;
            } else {
                html += `ملف PDF: <span class="file-name">${files[0].name}</span> (${(files[0].size / 1024).toFixed(1)} KB)`;
            }
            html += `</div>`;
            statusDiv.innerHTML = html;
        }

        function updateStandards() {
            const dId = parseInt(document.getElementById('domainSelect').value);
            const d = domains.find(x => x.id === dId);
            const stdSelect = document.getElementById('standardSelect');
            stdSelect.innerHTML = d ? d.standards.map(s => `<option value="${s.id}">${s.name}</option>`).join('') : '<option value="">اختر المعيار</option>';
            updateIndicators();
        }

        function updateIndicators() {
            const dId = parseInt(document.getElementById('domainSelect').value);
            const sId = document.getElementById('standardSelect').value;
            const d = domains.find(x => x.id === dId);
            const s = d ? d.standards.find(x => x.id === sId) : null;
            const indSelect = document.getElementById('indicatorSelect');
            indSelect.innerHTML = s ? s.indicators.map(i => `<option value="${i.id}">${i.name}</option>`).join('') : '<option value="">اختر المؤشر</option>';
        }

        async function submitEvidence(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitEvidenceBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
            
            try {
                const evidenceId = Date.now().toString();

                const images = [];
                const filesInput = document.getElementById('evImages').files;
                for (let i = 0; i < Math.min(filesInput.length, 4); i++) {
                    try {
                        const url = await uploadImageToStorage(filesInput[i], evidenceId);
                        if (url) images.push(url);
                    } catch (err) {
                        console.error('فشل رفع الصورة:', err);
                        showErrorModal('خطأ في رفع الصورة', `فشل رفع الصورة ${i+1}: ${err.message}`);
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ الشاهد';
                        return;
                    }
                }

                const pdfInput = document.getElementById('evPdf').files[0];
                let pdfUrl = null;
                if (pdfInput) {
                    try {
                        pdfUrl = await uploadPdfToStorage(pdfInput, evidenceId);
                    } catch (err) {
                        console.error('فشل رفع PDF:', err);
                        showErrorModal('خطأ في رفع PDF', `فشل رفع ملف PDF: ${err.message}`);
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ الشاهد';
                        return;
                    }
                }

                const implementersSelect = document.getElementById('evImplementers');
                const selectedImplementerIds = Array.from(implementersSelect.selectedOptions).map(opt => parseInt(opt.value));
                if (!selectedImplementerIds.includes(currentUser.id)) selectedImplementerIds.push(currentUser.id);
                const implementers = selectedImplementerIds.map(id => { const user = users.find(u => u.id === id); return { userId: user.id, userName: user.name, userRole: user.roleLabel }; });

                const newEvidence = {
                    id: evidenceId,
                    domainId: parseInt(document.getElementById('domainSelect').value),
                    standardId: document.getElementById('standardSelect').value,
                    indicatorId: document.getElementById('indicatorSelect').value,
                    title: document.getElementById('evTitle').value,
                    description: document.getElementById('evDesc').value,
                    beneficiaries: document.getElementById('evBeneficiaries').value,
                    implementers: implementers,
                    date: document.getElementById('evDate').value,
                    images: images,
                    pdf: pdfUrl,
                    userId: currentUser.id,
                    userName: currentUser.name,
                    userRole: currentUser.roleLabel,
                    status: currentUser.role === 'leader' ? 'approved' : 'pending',
                    approvals: []
                };

                const saved = await saveEvidenceToDb(newEvidence);
                if (saved) {
                    evidences.push(newEvidence);
                    if (currentUser.role === 'leader') {
                        showSuccessModal('تم الحفظ', 'تم حفظ الشاهد واعتماده تلقائياً', () => showPreviousEvidences());
                    } else {
                        showSuccessModal('تم الحفظ', 'تم حفظ الشاهد. سيكون متاحاً في التقارير بعد اعتماده', () => showPreviousEvidences());
                    }
                } else {
                    showErrorModal('خطأ', 'فشل في حفظ الشاهد');
                }
            } catch (error) {
                console.error('خطأ في حفظ الشاهد:', error);
                showErrorModal('خطأ', `حدث خطأ: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ الشاهد';
            }
        }

        function showPreviousEvidences() {
            const container = document.getElementById('evidenceContent');
            if(!container) return;
            if(evidences.length === 0) { container.innerHTML = `<div class="etec-card" style="text-align: center; color: var(--text-muted);"><p>لا توجد شواهد مسجلة حتى الآن.</p></div>`; return; }

            const userEvidences = currentUser.role === 'leader' ? evidences : evidences.filter(e => {
                if (e.userId === currentUser.id) return true;
                if (e.implementers && e.implementers.some(imp => imp.userId === currentUser.id)) return true;
                return false;
            });

            const printableEvidences = userEvidences.filter(e => e.status === 'approved' || e.status === 'pending');
            if (userEvidences.length === 0) { container.innerHTML = `<div class="etec-card" style="text-align: center; color: var(--text-muted);"><p>لا توجد شواهد مسجلة من قبلك.</p></div>`; return; }

            const canPrint = currentUser.role !== 'external_committee';

            container.innerHTML = `
                <div class="etec-card">
                    <div class="etec-card-header">
                        <div class="etec-card-title">قائمة الشواهد</div>
                        <div style="display: flex; gap: 10px;">
                            ${canPrint && printableEvidences.length > 0 ? `<button class="btn-etec-success" onclick="printSelectedEvidences()"><i class="fas fa-print"></i> طباعة المحدد (0)</button>` : ''}
                        </div>
                    </div>
                    ${canPrint && printableEvidences.length > 0 ? `
                        <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center;">
                            <button class="btn-etec-secondary btn-sm" onclick="selectAllPrintableEvidences()"><i class="fas fa-check-square"></i> تحديد الكل</button>
                            <button class="btn-etec-secondary btn-sm" onclick="deselectAllPrintableEvidences()"><i class="fas fa-square"></i> إلغاء التحديد</button>
                            <span style="color: var(--text-muted); font-size: 13px;"><i class="fas fa-info-circle"></i> يمكنك تحديد الشواهد المراد طباعتها (المعتمدة وقيد الانتظار فقط)</span>
                        </div>
                    ` : ''}
                    <table class="etec-table">
                        <thead>
                            <tr>
                                ${canPrint && printableEvidences.length > 0 ? '<th style="width: 40px; text-align: center;"><input type="checkbox" id="printAllCheckbox" class="print-checkbox" onchange="toggleAllPrintCheckboxes()"></th>' : ''}
                                <th>عنوان النشاط</th><th>التاريخ</th><th>المنفذون</th><th>الحالة</th><th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${userEvidences.map(e => {
                                let statusBadge = '', statusLabel = '', isPrintable = false;
                                if (e.status === 'approved') { statusBadge = 'badge-status-approved'; statusLabel = 'معتمد'; isPrintable = true; }
                                else if (e.status === 'rejected') { statusBadge = 'badge-status-rejected'; statusLabel = 'مرفوض'; }
                                else { statusBadge = 'badge-status-pending'; statusLabel = 'قيد الاعتماد'; isPrintable = true; }
                                const implementersNames = e.implementers && e.implementers.length > 0 ? e.implementers.map(imp => imp.userName).join('، ') : e.userName;
                                const canEdit = e.userId === currentUser.id || (e.implementers && e.implementers.some(imp => imp.userId === currentUser.id));
                                const canDelete = e.userId === currentUser.id;
                                return `<tr>
                                    ${canPrint && printableEvidences.length > 0 ? `<td style="text-align: center;">${isPrintable ? `<input type="checkbox" class="print-evidence-checkbox print-checkbox" data-evidence-id="${e.id}" onchange="updatePrintButton()">` : '<span style="color: #ccc;">✗</span>'}</td>` : ''}
                                    <td>${e.title}</td><td>${e.date}</td><td>${implementersNames}</td>
                                    <td><span class="${statusBadge}">${statusLabel}</span></td>
                                    <td>
                                        <button class="btn-etec-secondary btn-sm" onclick="viewEvidence('${e.id}')"><i class="fas fa-eye"></i></button>
                                        ${canEdit ? `<button class="btn-etec-secondary btn-sm" onclick="editEvidence('${e.id}')" style="background-color: #27AE60;"><i class="fas fa-edit"></i></button>` : ''}
                                        ${canDelete ? `<button class="btn-etec-primary btn-sm" onclick="deleteEvidence('${e.id}')" style="background-color: #E74C3C;"><i class="fas fa-trash"></i></button>` : ''}
                                        ${canPrint && isPrintable ? `<button class="btn-etec-warning btn-sm" onclick="printSingleEvidence('${e.id}')" title="طباعة هذا الشاهد"><i class="fas fa-print"></i></button>` : ''}
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                    ${userEvidences.filter(e => e.status === 'rejected').map(e => {
                        const rejections = e.approvals ? e.approvals.filter(a => a.status === 'rejected') : [];
                        if (rejections.length === 0) return '';
                        return `<div class="rejection-box"><h4><i class="fas fa-exclamation-triangle"></i> أسباب رفض الشاهد: "${e.title}"</h4>${rejections.map(r => `<div class="rejection-item"><strong>${r.userName} (${r.role})</strong>: ${r.reason}</div>`).join('')}</div>`;
                    }).join('')}
                </div>
            `;
        }

        function selectAllPrintableEvidences() { document.querySelectorAll('.print-evidence-checkbox').forEach(cb => cb.checked = true); updatePrintButton(); updateMasterCheckbox(); }
        function deselectAllPrintableEvidences() { document.querySelectorAll('.print-evidence-checkbox').forEach(cb => cb.checked = false); updatePrintButton(); updateMasterCheckbox(); }
        function toggleAllPrintCheckboxes() { const master = document.getElementById('printAllCheckbox'); document.querySelectorAll('.print-evidence-checkbox').forEach(cb => cb.checked = master.checked); updatePrintButton(); }
        function updatePrintButton() {
            const selectedCount = document.querySelectorAll('.print-evidence-checkbox:checked').length;
            document.querySelectorAll('[onclick="printSelectedEvidences()"]').forEach(btn => {
                if (selectedCount === 0) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; }
                else { btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; }
                btn.innerHTML = `<i class="fas fa-print"></i> طباعة المحدد (${selectedCount})`;
            });
        }
        function updateMasterCheckbox() {
            const master = document.getElementById('printAllCheckbox');
            if (!master) return;
            const checkboxes = document.querySelectorAll('.print-evidence-checkbox');
            const checkedCount = document.querySelectorAll('.print-evidence-checkbox:checked').length;
            if (checkedCount === 0) { master.checked = false; master.indeterminate = false; }
            else if (checkedCount === checkboxes.length) { master.checked = true; master.indeterminate = false; }
            else { master.checked = false; master.indeterminate = true; }
        }

        function showEvidenceApproval() {
            if (currentUser.role !== 'leader' && currentUser.role !== 'internal_committee') return;
            const container = document.getElementById('evidenceContent');
            if(!container) return;
            const pendingEvidences = evidences.filter(e => { if (e.userId === currentUser.id) return false; if (e.status === 'approved') return false; return true; });
            if (pendingEvidences.length === 0) { container.innerHTML = `<div class="etec-card" style="text-align: center; color: var(--text-muted);"><p>لا توجد شواهد بانتظار الاعتماد.</p></div>`; return; }
            container.innerHTML = `
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">اعتماد الشواهد المرفوعة</div></div>
                    <table class="etec-table">
                        <thead><tr><th>عنوان الشاهد</th><th>مقدم من</th><th>حالتي</th><th>الإجراءات</th></tr></thead>
                        <tbody>
                            ${pendingEvidences.map(e => {
                                const myApproval = getUserApprovalStatus(e, currentUser.id);
                                let myStatusBadge = '', myStatusLabel = '';
                                if (myApproval === 'approved') { myStatusBadge = 'badge-status-approved'; myStatusLabel = 'وافقت'; }
                                else if (myApproval === 'rejected') { myStatusBadge = 'badge-status-rejected'; myStatusLabel = 'رفضت'; }
                                else { myStatusBadge = 'badge-status-waiting'; myStatusLabel = 'بانتظار قراري'; }
                                return `<tr>
                                    <td>${e.title}</td><td>${e.userName}</td>
                                    <td><span class="${myStatusBadge}">${myStatusLabel}</span></td>
                                    <td>
                                        <button class="btn-etec-secondary btn-sm" onclick="viewEvidence('${e.id}')"><i class="fas fa-eye"></i></button>
                                        <button class="btn-etec-success btn-sm" onclick="approveEvidence('${e.id}')"><i class="fas fa-check"></i> اعتماد</button>
                                        <button class="btn-etec-danger btn-sm" onclick="rejectEvidence('${e.id}')"><i class="fas fa-times"></i> رفض</button>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // ============================================================
        // 17. VIEW, EDIT, DELETE EVIDENCE
        // ============================================================
        function viewEvidence(id) {
            const evidence = evidences.find(e => e.id === id);
            if (!evidence) return;
            const domain = domains.find(d => d.id === evidence.domainId);
            const standard = domain?.standards.find(s => s.id === evidence.standardId);
            const indicator = standard?.indicators.find(i => i.id === evidence.indicatorId);
            let statusBadge = '', statusLabel = '';
            if (evidence.status === 'approved') { statusBadge = 'badge-status-approved'; statusLabel = 'معتمد'; }
            else if (evidence.status === 'rejected') { statusBadge = 'badge-status-rejected'; statusLabel = 'مرفوض'; }
            else { statusBadge = 'badge-status-pending'; statusLabel = 'قيد الاعتماد'; }
            const canPrint = currentUser.role !== 'external_committee' && (evidence.status === 'approved' || evidence.status === 'pending');
            const implementersNames = evidence.implementers && evidence.implementers.length > 0 ? evidence.implementers.map(imp => imp.userName).join('، ') : evidence.userName;

            let html = `
                <div class="etec-card">
                    <div class="etec-card-header">
                        <div class="etec-card-title">عرض الشاهد</div>
                        <div style="display: flex; gap: 10px;">
                            ${canPrint ? `<button class="btn-etec-warning btn-sm" onclick="printSingleEvidence('${evidence.id}')"><i class="fas fa-print"></i> طباعة الشاهد</button>` : ''}
                            <button class="btn-etec-secondary btn-sm" onclick="showPreviousEvidences()">رجوع</button>
                        </div>
                    </div>
                    <h3 style="color: var(--etec-primary); margin-bottom: 20px;">${evidence.title}</h3>
                    <p><strong>الحالة:</strong> <span class="${statusBadge}">${statusLabel}</span></p>
                    <p><strong>المجال:</strong> ${domain?.name}</p>
                    <p><strong>المعيار:</strong> ${standard?.name}</p>
                    <p><strong>المؤشر:</strong> ${indicator?.name}</p>
                    <p><strong>الوصف:</strong> ${evidence.description || 'لا يوجد'}</p>
                    <p><strong>المستفيدون:</strong> ${evidence.beneficiaries || 'لا يوجد'}</p>
                    <p><strong>المنفذون:</strong> ${implementersNames}</p>
                    <p><strong>التاريخ:</strong> ${evidence.date}</p>
                    <p><strong>الرافع:</strong> ${evidence.userName}</p>
            `;
            
            const rejections = evidence.approvals ? evidence.approvals.filter(a => a.status === 'rejected') : [];
            if (rejections.length > 0) {
                html += `<div class="rejection-box" style="margin-top: 15px;"><h4><i class="fas fa-exclamation-triangle"></i> أسباب الرفض:</h4>${rejections.map(r => `<div class="rejection-item"><strong>${r.userName} (${r.role})</strong>: ${r.reason}</div>`).join('')}</div>`;
            }
            
            html += `<div style="margin-top: 20px;"><strong>حالة الاعتمادات:</strong><table class="etec-table"><thead><tr><th>المعتمد</th><th>الصفة</th><th>الحالة</th><th>سبب الرفض</th></tr></thead><tbody>`;
            if (evidence.approvals && evidence.approvals.length > 0) {
                evidence.approvals.forEach(a => {
                    let aBadge = '', aLabel = '';
                    if (a.status === 'approved') { aBadge = 'badge-status-approved'; aLabel = 'وافق'; }
                    else if (a.status === 'rejected') { aBadge = 'badge-status-rejected'; aLabel = 'رفض'; }
                    html += `<tr><td>${a.userName}</td><td>${a.role}</td><td><span class="${aBadge}">${aLabel}</span></td><td>${a.reason || '-'}</td></tr>`;
                });
            } else { html += `<tr><td colspan="4" style="text-align: center;">لا توجد اعتمادات بعد</td></tr>`; }
            html += `</tbody></table></div>`;
            
            if (evidence.images && evidence.images.length > 0) {
                html += `<div style="margin-top: 20px;">${getImagesGridHtml(evidence.images)}</div>`;
            }
            
            if (evidence.pdf) {
                html += `<div class="pdf-pages-container" id="viewPdfContainer_${evidence.id}"></div>`;
            }
            
            html += `</div>`;
            document.getElementById('evidenceContent').innerHTML = html;
            
            if (evidence.pdf) {
                renderPdfFromUrl(evidence.pdf, `viewPdfContainer_${evidence.id}`);
            }
        }

        async function deleteEvidence(id) {
            const evidence = evidences.find(e => e.id === id);
            if (!evidence) return;
            if (evidence.userId !== currentUser.id && currentUser.role !== 'leader') { showErrorModal('خطأ', 'فقط الرافع الأصلي للشاهد يمكنه حذفه'); return; }
            showConfirmModal('تأكيد الحذف', `هل أنت متأكد من حذف الشاهد "${evidence.title}" بشكل نهائي؟`, async () => {
                const deleted = await deleteEvidenceFromDb(id);
                if (deleted) {
                    evidences = evidences.filter(e => e.id !== id);
                    showSuccessModal('تم الحذف', 'تم حذف الشاهد بنجاح', () => showPreviousEvidences());
                } else {
                    showErrorModal('خطأ', 'فشل في حذف الشاهد');
                }
            });
        }

        function editEvidence(id) {
            const evidence = evidences.find(e => e.id === id);
            if (!evidence) return;
            const canEdit = evidence.userId === currentUser.id || (evidence.implementers && evidence.implementers.some(imp => imp.userId === currentUser.id));
            if (!canEdit && currentUser.role !== 'leader') { showErrorModal('خطأ', 'ليس لديك صلاحية لتعديل هذا الشاهد'); return; }
            const availableUsers = users.filter(u => u.role !== 'external_committee');
            const currentImplementerIds = evidence.implementers && evidence.implementers.length > 0 ? evidence.implementers.map(imp => imp.userId) : [evidence.userId];

            document.getElementById('evidenceContent').innerHTML = `
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">تعديل الشاهد</div></div>
                    <form onsubmit="updateEvidence(event, '${evidence.id}')">
                        <div class="form-group">
                            <label>المجال الرئيسي</label>
                            <select id="editDomainSelect" class="form-control" onchange="updateEditStandards()" required>
                                <option value="">اختر المجال</option>
                                ${domains.map(d => `<option value="${d.id}" ${d.id === evidence.domainId ? 'selected' : ''}>${d.name}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group"><label>المعيار</label><select id="editStandardSelect" class="form-control" onchange="updateEditIndicators()" required></select></div>
                        <div class="form-group"><label>المؤشر</label><select id="editIndicatorSelect" class="form-control" required></select></div>
                        <div class="form-group"><label>النشاط (عنوان الشاهد)</label><input type="text" id="editEvTitle" class="form-control" required value="${evidence.title}"></div>
                        <div class="form-group"><label>وصف النشاط وأهدافه</label><textarea id="editEvDesc" class="form-control" rows="3" required>${evidence.description}</textarea></div>
                        <div class="form-group"><label>المستفيدون</label><input type="text" id="editEvBeneficiaries" class="form-control" required value="${evidence.beneficiaries}"></div>
                        <div class="form-group">
                            <label>المنفذون (يمكن اختيار أكثر من منفذ)</label>
                            <select id="editEvImplementers" class="form-control" multiple style="height: auto; min-height: 100px;">
                                ${availableUsers.map(u => `<option value="${u.id}" ${currentImplementerIds.includes(u.id) ? 'selected' : ''}>${u.name} - ${u.roleLabel}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group"><label>اليوم والتاريخ</label><input type="date" id="editEvDate" class="form-control" required value="${evidence.date}"></div>
                        <div class="form-group"><label>التوثيق الإعلامي / الصور</label><input type="file" id="editEvImages" class="form-control" accept="image/*" multiple></div>
                        <div class="form-group"><label>إرفاق ملف PDF</label><input type="file" id="editEvPdf" class="form-control" accept=".pdf"></div>
                        <div id="editUploadStatus" style="margin: 10px 0;"></div>
                        <button type="submit" class="btn-etec-primary">تحديث الشاهد (سيتم تصفير الاعتمادات)</button>
                        <button type="button" class="btn-etec-secondary" onclick="showPreviousEvidences()">إلغاء</button>
                    </form>
                </div>
            `;
            updateEditStandards(evidence.standardId);
            updateEditIndicators(evidence.indicatorId);
            
            document.getElementById('editEvImages').addEventListener('change', function() {
                updateEditUploadStatus(this.files, 'images');
            });
            document.getElementById('editEvPdf').addEventListener('change', function() {
                updateEditUploadStatus(this.files, 'pdf');
            });
        }

        function updateEditUploadStatus(files, type) {
            const statusDiv = document.getElementById('editUploadStatus');
            if (!statusDiv) return;
            if (files.length === 0) {
                statusDiv.innerHTML = '';
                return;
            }
            let html = `<div class="file-upload-status"><i class="fas fa-upload"></i> تم اختيار `;
            if (type === 'images') {
                html += `${files.length} صورة جديدة`;
            } else {
                html += `ملف PDF جديد: <span class="file-name">${files[0].name}</span> (${(files[0].size / 1024).toFixed(1)} KB)`;
            }
            html += `</div>`;
            statusDiv.innerHTML = html;
        }

        function updateEditStandards(selectedStandardId = null) {
            const dId = parseInt(document.getElementById('editDomainSelect').value);
            const d = domains.find(x => x.id === dId);
            const stdSelect = document.getElementById('editStandardSelect');
            stdSelect.innerHTML = d ? d.standards.map(s => `<option value="${s.id}" ${s.id === selectedStandardId ? 'selected' : ''}>${s.name}</option>`).join('') : '<option value="">اختر المعيار</option>';
            updateEditIndicators();
        }

        function updateEditIndicators(selectedIndicatorId = null) {
            const dId = parseInt(document.getElementById('editDomainSelect').value);
            const sId = document.getElementById('editStandardSelect').value;
            const d = domains.find(x => x.id === dId);
            const s = d ? d.standards.find(x => x.id === sId) : null;
            const indSelect = document.getElementById('editIndicatorSelect');
            indSelect.innerHTML = s ? s.indicators.map(i => `<option value="${i.id}" ${i.id === selectedIndicatorId ? 'selected' : ''}>${i.name}</option>`).join('') : '<option value="">اختر المؤشر</option>';
        }

        async function updateEvidence(e, id) {
            e.preventDefault();
            const evidence = evidences.find(ev => ev.id === id);
            if (!evidence) return;
            const canEdit = evidence.userId === currentUser.id || (evidence.implementers && evidence.implementers.some(imp => imp.userId === currentUser.id));
            if (!canEdit && currentUser.role !== 'leader') { showErrorModal('خطأ', 'ليس لديك صلاحية لتعديل هذا الشاهد'); return; }

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';

            try {
                const images = evidence.images || [];
                const filesInput = document.getElementById('editEvImages').files;
                for (let i = 0; i < Math.min(filesInput.length, 4); i++) {
                    try {
                        const url = await uploadImageToStorage(filesInput[i], id);
                        if (url) images.push(url);
                    } catch (err) {
                        showErrorModal('خطأ في رفع الصورة', err.message);
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = 'تحديث الشاهد (سيتم تصفير الاعتمادات)';
                        return;
                    }
                }
                
                const pdfInput = document.getElementById('editEvPdf').files[0];
                let pdfUrl = evidence.pdf;
                if (pdfInput) {
                    try {
                        pdfUrl = await uploadPdfToStorage(pdfInput, id);
                    } catch (err) {
                        showErrorModal('خطأ في رفع PDF', err.message);
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = 'تحديث الشاهد (سيتم تصفير الاعتمادات)';
                        return;
                    }
                }

                const implementersSelect = document.getElementById('editEvImplementers');
                const selectedImplementerIds = Array.from(implementersSelect.selectedOptions).map(opt => parseInt(opt.value));
                if (!selectedImplementerIds.includes(evidence.userId)) selectedImplementerIds.push(evidence.userId);
                const implementers = selectedImplementerIds.map(uid => { const user = users.find(u => u.id === uid); return { userId: user.id, userName: user.name, userRole: user.roleLabel }; });

                evidence.domainId = parseInt(document.getElementById('editDomainSelect').value);
                evidence.standardId = document.getElementById('editStandardSelect').value;
                evidence.indicatorId = document.getElementById('editIndicatorSelect').value;
                evidence.title = document.getElementById('editEvTitle').value;
                evidence.description = document.getElementById('editEvDesc').value;
                evidence.beneficiaries = document.getElementById('editEvBeneficiaries').value;
                evidence.implementers = implementers;
                evidence.date = document.getElementById('editEvDate').value;
                evidence.images = images;
                evidence.pdf = pdfUrl;
                evidence.approvals = [];
                evidence.status = currentUser.role === 'leader' ? 'approved' : 'pending';

                const updated = await updateEvidenceInDb(evidence);
                if (updated) showSuccessModal('تم التحديث', 'تم تحديث الشاهد. سيحتاج إلى اعتماد جديد', () => showPreviousEvidences());
                else showErrorModal('خطأ', 'فشل في تحديث الشاهد');
            } catch (error) {
                showErrorModal('خطأ', `حدث خطأ: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'تحديث الشاهد (سيتم تصفير الاعتمادات)';
            }
        }

        // ============================================================
        // 18. PRINT FUNCTIONS
        // ============================================================
        function printSingleEvidence(evidenceId) {
            const evidence = evidences.find(e => e.id === evidenceId);
            if (!evidence) return;
            if (evidence.status !== 'approved' && evidence.status !== 'pending') { 
                showErrorModal('تنبيه', 'لا يمكن طباعة الشواهد المرفوضة'); 
                return; 
            }
            
            const printWindow = window.open('', '_blank', 'width=800,height=600');
            if (!printWindow) { 
                showErrorModal('خطأ', 'الرجاء السماح بالنوافذ المنبثقة'); 
                return; 
            }
            
            const domain = domains.find(d => d.id === evidence.domainId);
            const standard = domain?.standards.find(s => s.id === evidence.standardId);
            const indicator = standard?.indicators.find(i => i.id === evidence.indicatorId);
            const implementersNames = evidence.implementers && evidence.implementers.length > 0 ? evidence.implementers.map(imp => imp.userName).join('، ') : evidence.userName;

            const imagesHtml = evidence.images && evidence.images.length > 0 ? 
                evidence.images.map(img => {
                    const displaySrc = getDriveDirectImageUrl(img);
                    return `<img src="${displaySrc}" alt="صورة الشاهد" style="width:100%; height:200px; object-fit:cover; border-radius:8px; border:1px solid #E2E8F0;">`;
                }).join('') : '';

            printWindow.document.write(`
                <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
                <title>طباعة شاهد - ${evidence.title}</title>
                <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { font-family: 'Cairo', sans-serif; direction: rtl; text-align: right; background: white; padding: 20px; }
                    .evidence-print-page { max-width: 800px; margin: 0 auto; padding: 40px; border: 2px solid #3A2375; border-radius: 12px; page-break-after: always; }
                    .print-header { text-align: center; border-bottom: 3px solid #3A2375; padding-bottom: 15px; margin-bottom: 25px; }
                    .print-header h1 { color: #3A2375; font-size: 28px; margin-bottom: 5px; }
                    .print-header p { color: #64748B; font-size: 14px; }
                    .evidence-title { text-align: center; font-size: 22px; font-weight: 700; color: #C82269; margin-bottom: 25px; padding: 10px; background: #FFF0F5; border-radius: 8px; }
                    .info-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                    .info-table th, .info-table td { border: 1px solid #E2E8F0; padding: 12px; line-height: 1.8; vertical-align: top; }
                    .info-table th { background: #F4F5F8; width: 30%; font-weight: 600; color: #3A2375; }
                    .info-table td { width: 70%; }
                    .images-section { margin-top: 20px; }
                    .images-section h3 { color: #3A2375; margin-bottom: 15px; border-bottom: 2px solid #E2E8F0; padding-bottom: 10px; }
                    .images-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
                    .signature { margin-top: 40px; text-align: left; font-weight: 700; font-size: 15px; }
                    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-weight: 600; font-size: 12px; color: white; }
                    .status-approved { background: #27AE60; }
                    .status-pending { background: #E77B26; }
                    @media print {
                        .no-print { display: none; }
                    }
                </style>
                </head>
                <body>
                    <div class="evidence-print-page">
                        <div class="print-header">
                            <h1>منصة الاعتماد المدرسي</h1>
                            <p>مدرسة عمرو بن العاص الابتدائية</p>
                        </div>
                        <div class="evidence-title">${evidence.title}</div>
                        <table class="info-table">
                            <tr><th>المجال</th><td>${domain ? domain.name : ''}</td></tr>
                            <tr><th>المعيار</th><td>${standard ? standard.name : ''}</td></tr>
                            <tr><th>المؤشر</th><td>${indicator ? indicator.name : ''}</td></tr>
                            <tr><th>وصف النشاط</th><td>${evidence.description || '-'}</td></tr>
                            <tr><th>المستفيدون</th><td>${evidence.beneficiaries || '-'}</td></tr>
                            <tr><th>المنفذون</th><td>${implementersNames}</td></tr>
                            <tr><th>التاريخ</th><td>${evidence.date}</td></tr>
                            <tr><th>الحالة</th><td><span class="status-badge ${evidence.status === 'approved' ? 'status-approved' : 'status-pending'}">${evidence.status === 'approved' ? 'معتمد' : 'قيد الاعتماد'}</span></td></tr>
                        </table>
                        ${evidence.images && evidence.images.length > 0 ? `
                            <div class="images-section">
                                <h3>التوثيق الإعلامي والصور</h3>
                                <div class="images-grid">
                                    ${imagesHtml}
                                </div>
                            </div>
                        ` : ''}
                        <div class="signature">
                            مدير المدرسة: ___________________
                        </div>
                    </div>
                    <script>
                        window.onload = function() { window.print(); };
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        function printSelectedEvidences() {
            const checkboxes = document.querySelectorAll('.print-evidence-checkbox:checked');
            if (checkboxes.length === 0) {
                showErrorModal('تنبيه', 'برجاء اختيار شاهد واحد على الأقل للطباعة');
                return;
            }

            const selectedIds = Array.from(checkboxes).map(cb => cb.getAttribute('data-evidence-id'));
            const selectedEvidences = evidences.filter(e => selectedIds.includes(e.id));

            const printWindow = window.open('', '_blank', 'width=900,height=700');
            if (!printWindow) {
                showErrorModal('خطأ', 'الرجاء السماح بالنوافذ المنبثقة');
                return;
            }

            let htmlContent = `
                <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
                <title>طباعة الشواهد المختارة</title>
                <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { font-family: 'Cairo', sans-serif; direction: rtl; text-align: right; background: white; padding: 20px; }
                    .evidence-print-page { max-width: 800px; margin: 0 auto 30px auto; padding: 30px; border: 2px solid #3A2375; border-radius: 12px; page-break-after: always; }
                    .evidence-print-page:last-child { page-break-after: auto; }
                    .print-header { text-align: center; border-bottom: 3px solid #3A2375; padding-bottom: 10px; margin-bottom: 20px; }
                    .print-header h1 { color: #3A2375; font-size: 24px; margin-bottom: 5px; }
                    .print-header p { color: #64748B; font-size: 13px; }
                    .evidence-title { text-align: center; font-size: 20px; font-weight: 700; color: #C82269; margin-bottom: 20px; padding: 8px; background: #FFF0F5; border-radius: 8px; }
                    .info-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
                    .info-table th, .info-table td { border: 1px solid #E2E8F0; padding: 10px; line-height: 1.6; vertical-align: top; font-size: 14px; }
                    .info-table th { background: #F4F5F8; width: 30%; font-weight: 600; color: #3A2375; }
                    .info-table td { width: 70%; }
                    .images-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
                    .images-grid img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; border: 1px solid #E2E8F0; }
                    .signature { margin-top: 25px; text-align: left; font-weight: 700; font-size: 14px; }
                </style>
                </head>
                <body>
            `;

            selectedEvidences.forEach(evidence => {
                const domain = domains.find(d => d.id === evidence.domainId);
                const standard = domain?.standards.find(s => s.id === evidence.standardId);
                const indicator = standard?.indicators.find(i => i.id === evidence.indicatorId);
                const implementersNames = evidence.implementers && evidence.implementers.length > 0 ? evidence.implementers.map(imp => imp.userName).join('، ') : evidence.userName;

                const imagesHtml = evidence.images && evidence.images.length > 0 ? 
                    evidence.images.map(img => {
                        const displaySrc = getDriveDirectImageUrl(img);
                        return `<img src="${displaySrc}" alt="صورة الشاهد">`;
                    }).join('') : '';

                htmlContent += `
                    <div class="evidence-print-page">
                        <div class="print-header">
                            <h1>منصة الاعتماد المدرسي</h1>
                            <p>مدرسة عمرو بن العاص الابتدائية</p>
                        </div>
                        <div class="evidence-title">${evidence.title}</div>
                        <table class="info-table">
                            <tr><th>المجال</th><td>${domain ? domain.name : ''}</td></tr>
                            <tr><th>المعيار</th><td>${standard ? standard.name : ''}</td></tr>
                            <tr><th>المؤشر</th><td>${indicator ? indicator.name : ''}</td></tr>
                            <tr><th>وصف النشاط</th><td>${evidence.description || '-'}</td></tr>
                            <tr><th>المستفيدون</th><td>${evidence.beneficiaries || '-'}</td></tr>
                            <tr><th>المنفذون</th><td>${implementersNames}</td></tr>
                            <tr><th>التاريخ</th><td>${evidence.date}</td></tr>
                        </table>
                        ${evidence.images && evidence.images.length > 0 ? `
                            <div class="images-grid">
                                ${imagesHtml}
                            </div>
                        ` : ''}
                        <div class="signature">مدير المدرسة: ___________________</div>
                    </div>
                `;
            });

            htmlContent += `
                <script>
                    window.onload = function() { window.print(); };
                <\/script>
                </body>
                </html>
            `;

            printWindow.document.write(htmlContent);

        }

        // ============================================================
        // 19. REPORTS & BACKUP
        // ============================================================
        function showReports() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="content-header"><h1>التقارير والإحصائيات</h1></div>
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">إحصائيات المجالات</div></div>
                    <table class="etec-table">
                        <thead>
                            <tr>
                                <th>المجال الرئيسي</th>
                                <th>عدد المعايير</th>
                                <th>عدد المؤشرات</th>
                                <th>الشواهد المرفوعة</th>
                                <th>المعتمدة</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${domains.map(d => {
                                const totalStandards = d.standards.length;
                                const totalIndicators = d.standards.reduce((acc, s) => acc + s.indicators.length, 0);
                                const domainEvidences = evidences.filter(e => e.domainId === d.id);
                                const approvedEvidences = domainEvidences.filter(e => e.status === 'approved').length;
                                return `<tr>
                                    <td><strong>${d.name}</strong></td>
                                    <td>${totalStandards}</td>
                                    <td>${totalIndicators}</td>
                                    <td>${domainEvidences.length}</td>
                                    <td><span class="badge-status-approved">${approvedEvidences}</span></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function showBackup() {
            if (currentUser.role !== 'leader') return;
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="content-header"><h1>النسخ الاحتياطي والإدارة</h1></div>
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">تصدير واستيراد البيانات</div></div>
                    <p style="margin-bottom: 20px; color: var(--text-muted);">يمكنك تصدير بيانات الشواهد كملف JSON للنسخ الاحتياطي أو استيرادها لاحقاً.</p>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                        <button class="btn-etec-primary" onclick="exportData()"><i class="fas fa-download"></i> تصدير النسخة الاحتياطية (JSON)</button>
                        <label class="btn-etec-secondary" style="cursor: pointer; margin: 0;">
                            <i class="fas fa-upload"></i> استيراد نسخة احتياطية
                            <input type="file" id="importJsonFile" accept=".json" onchange="importData(event)" style="display: none;">
                        </label>
                    </div>
                </div>
            `;
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(evidences, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_evidences_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        for (const item of imported) {
                            await saveEvidenceToDb(item);
                        }
                        await loadEvidencesFromDb();
                        showSuccessModal('تم الاستيراد', 'تم استيراد البيانات بنجاح', () => showPreviousEvidences());
                    } else {
                        showErrorModal('خطأ', 'نسق الملف غير صحيح');
                    }
                } catch (err) {
                    showErrorModal('خطأ', 'فشل في قراءة ملف البيانات');
                }
            };
            reader.readAsText(file);
        }

        // ============================================================
        // 20. SYSTEM INITIALIZATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 نظام منصة الاعتماد المدرسي جاهز للعمل');
            console.log('📁 سيتم تخزين الملفات في Google Drive (Service Account)');
            console.log('⚠️ تأكد من استبدال القيم: SERVICE_ACCOUNT_EMAIL, PRIVATE_KEY, DRIVE_FOLDER_ID');
        });
    </script>
