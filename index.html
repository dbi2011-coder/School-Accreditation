                                                        const cid = `reportAppendixPdf_${ev.id}_${appIdx}_${pdfIdx}`;
                                                        pdfTasks.push({ cid, pdfData });
                                                        html += `<div class="report-page pdf-pages-container" id="${cid}"></div>`;
                                                    });
                                                }
                                            });
                                        }
                                    });
                                }
                            }
                        });
                    });
                }
            });
            if (!hasData) html += `<div class="etec-card" style="text-align: center; padding: 40px;"><h3 style="color: var(--etec-primary);">لا توجد شواهد معتمدة للمؤشرات المحددة</h3><button class="btn-etec-secondary" onclick="showReportBuilder()" style="margin-top: 15px;">العودة للاختيار</button></div>`;
            let progressHtml = '';
            if (pdfTasks.length > 0 && hasData) {
                progressHtml = createProgressBar('reportPdfProgress', pdfTasks.length, 'جاري تحميل المرفقات في التقرير');
                html = progressHtml + html;
            }
            document.getElementById('reportContent').innerHTML = html;
            let completed = 0;
            for (const task of pdfTasks) {
                if (document.getElementById(task.cid)) await renderPdfToCanvas(task.cid, task.pdfData, task.cid);
                completed++;
                updateProgressBar('reportPdfProgress', completed, pdfTasks.length);
            }
            if (pdfTasks.length > 0) setTimeout(() => hideProgressBar('reportPdfProgress'), 800);
        }

        function printReport() { window.print(); }

        function showWorkProgress() {
            let tableHTML = `
                <div class="no-print" style="margin-bottom: 20px; text-align: left;"><button class="btn-etec-primary" onclick="printWorkProgress()"><i class="fas fa-print"></i> طباعة سير العمل</button></div>
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">متابعة سير العمل</div></div>
                    <div class="table-responsive">
                        <table class="etec-table">
                            <thead><tr><th>المجال</th><th>المعيار</th><th>المؤشر</th><th>عدد الشواهد المعتمدة</th><th>الحالة</th></tr></thead>
                            <tbody>
            `;
            domains.forEach(domain => {
                domain.standards.forEach(standard => {
                    standard.indicators.forEach(indicator => {
                        const approvedCount = evidences.filter(e => e.indicatorId === indicator.id && e.status === 'approved').length;
                        let statusLabel = '', statusClass = '';
                        if (approvedCount === 0) { statusLabel = 'لا توجد شواهد'; statusClass = 'badge-no-evidence'; }
                        else if (approvedCount <= 2) { statusLabel = 'منخفض'; statusClass = 'badge-low'; }
                        else if (approvedCount <= 4) { statusLabel = 'متوسط'; statusClass = 'badge-medium'; }
                        else if (approvedCount === 5) { statusLabel = 'مرتفع'; statusClass = 'badge-high'; }
                        else { statusLabel = 'مرتفع جداً'; statusClass = 'badge-very-high'; }
                        tableHTML += `<tr>
                            <td data-label="المجال">${domain.name}</td>
                            <td data-label="المعيار">${standard.name}</td>
                            <td class="evidence-title-cell" data-label="المؤشر">${indicator.name}</td>
                            <td data-label="عدد الشواهد المعتمدة" style="text-align: center;">${approvedCount}</td>
                            <td class="status-cell" data-label="الحالة"><span class="badge-level ${statusClass}">${statusLabel}</span></td>
                        </tr>`;
                    });
                });
            });
            tableHTML += `</tbody></table></div></div>`;
            document.getElementById('reportContent').innerHTML = tableHTML;
        }

        function printWorkProgress() { window.print(); }

        function showBackup() {
            if (currentUser.role !== 'leader') return;
            document.getElementById('contentArea').innerHTML = `
                <div class="content-header"><h1>النسخ الاحتياطي</h1></div>
                <div class="etec-card">
                    <div class="etec-card-header"><div class="etec-card-title">إدارة النسخ الاحتياطي</div></div>
                    <div style="display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap;">
                        <div class="etec-card" style="flex: 1; min-width: 250px; text-align: center; cursor: pointer;" onclick="exportBackup()">
                            <i class="fas fa-download" style="font-size: 48px; color: var(--etec-primary);"></i>
                            <h3>تصدير البيانات (JSON)</h3>
                            <p style="color: var(--text-muted); margin-top: 10px;">حفظ نسخة من كل البيانات</p>
                        </div>
                        <div class="etec-card" style="flex: 1; min-width: 250px; text-align: center; cursor: pointer;" onclick="document.getElementById('importMergeFile').click()">
                            <i class="fas fa-file-import" style="font-size: 48px; color: var(--etec-primary);"></i>
                            <h3>استيراد ودمج</h3>
                            <p style="color: var(--text-muted); margin-top: 10px;">إضافة البيانات من ملف (بدون حذف الحالي)</p>
                            <input type="file" id="importMergeFile" accept=".json" style="display: none;" onchange="importMergeBackup(event)">
                        </div>
                    </div>
                    <div style="margin-top: 20px; padding: 15px; background: #E8F5E9; border-right: 4px solid #27AE60; border-radius: 8px; font-size: 13px; color: #1F7A4C;">
                        <strong><i class="fas fa-info-circle"></i> استيراد ودمج:</strong> يضيف البيانات من الملف فقط دون حذف البيانات الحالية.
                        <ul style="margin-top: 8px; padding-right: 20px; line-height: 1.8;">
                            <li><strong>المستخدمون:</strong> يُضاف المستخدمون الجدد فقط (لا يُغيّر الموجودين).</li>
                            <li><strong>كلمات المرور:</strong> لا تتأثر أبداً.</li>
                            <li><strong>الشواهد:</strong> تُضاف الشواهد الجديدة (تُتجاهل المكررة بنفس العنوان والتاريخ).</li>
                            <li><strong>المرفقات والاعتمادات:</strong> تُستورد مع الشواهد الجديدة.</li>
                        </ul>
                    </div>
                </div>
            `;
        }

        async function importMergeBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            showConfirmModal(
                '📥 تأكيد الاستيراد',
                'سيتم إضافة البيانات من الملف إلى البيانات الحالية (بدون حذف الموجود). هل أنت متأكد؟',
                async () => {
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        try {
                            const backupData = JSON.parse(e.target.result);
                            if (!backupData.users || !backupData.evidences) {
                                showErrorModal('خطأ', 'ملف النسخة الاحتياطية غير صالح');
                                event.target.value = '';
                                return;
                            }
                            showPrintProgressModal('جاري استيراد ودمج البيانات...');
                            updatePrintProgress(0, 1);
                            const result = await apiCall('/api/import-merge', {
                                method: 'POST',
                                body: { users: backupData.users, evidences: backupData.evidences }
                            });
                            updatePrintProgress(1, 1, 'اكتمل!');
                            setTimeout(() => hidePrintProgressModal(), 500);
                            if (result.success) {
                                await loadUsersFromAPI();
                                await loadEvidencesFromAPI();
                                const info = result.imported;
                                const message = `
                                    <div style="text-align: right; line-height: 2;">
                                        <strong>✅ المستخدمون:</strong><br>
                                        &nbsp;&nbsp;• تمت إضافة <strong style="color: #27AE60;">${info.usersAdded}</strong> مستخدم جديد<br>
                                        &nbsp;&nbsp;• تم تخطي <strong style="color: #E77B26;">${info.usersSkipped}</strong> مستخدم (موجود مسبقاً)<br>
                                        <br>
                                        <strong>✅ الشواهد:</strong><br>
                                        &nbsp;&nbsp;• تمت إضافة <strong style="color: #27AE60;">${info.evidencesAdded}</strong> شاهد جديد<br>
                                        &nbsp;&nbsp;• تم تخطي <strong style="color: #E77B26;">${info.evidencesSkipped}</strong> شاهد (موجود مسبقاً)
                                    </div>
                                `;
                                showSuccessModal('🎉 تم الاستيراد بنجاح', message, () => showBackup());
                            } else {
                                showErrorModal('خطأ', result.error || 'فشل الاستيراد');
                            }
                        } catch (error) {
                            hidePrintProgressModal();
                            showErrorModal('خطأ', 'تعذر قراءة الملف: ' + error.message);
                        }
                        event.target.value = '';
                    };
                    reader.readAsText(file);
                }
            );
        }

        function exportBackup() {
            const dataStr = JSON.stringify({ evidences, users, exportDate: new Date().toISOString() }, null, 2);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr));
            linkElement.setAttribute('download', `backup_${new Date().toISOString().split('T')[0]}.json`);
            linkElement.click();
            showSuccessModal('تم التصدير', 'تم تصدير البيانات بنجاح');
        }

        // ====== Auto Refresh (كل 30 ثانية) ======
        let autoRefreshInterval = null;
        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(async () => {
                if (currentUser) {
                    await loadUsersFromAPI();
                    await loadEvidencesFromAPI();
                    console.log('🔄 تم تحديث البيانات تلقائياً');
                }
            }, 30000);
        }
        function stopAutoRefresh() {
            if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
        }

        // ====== Init ======
        (function init() {
            console.log('✅ منصة الاعتماد المدرسي - جاهزة');
            console.log('API Base:', API_BASE);
        })();
    </script>
</body>
</html>
